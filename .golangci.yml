# Lint and the STACKSPEC 3.2 / 3.3 boundary check in one invocation.
# depguard works on import paths, which is the granularity the layer graph uses.

version: '2'

run:
  timeout: 5m

formatters:
  enable:
    - gofmt

linters:
  enable:
    - depguard # 3.2 layer boundaries, 3.3 adapter confinement
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck

  settings:
    depguard:
      rules:
        # 3.2: the store package is the only one that imports the database
        # driver, database/sql or the migration tool.
        driver-confinement:
          files: ['**', '!**/apps/controller/internal/store/**']
          deny:
            - pkg: 'database/sql'
              desc: 'only apps/controller/internal/store may use database/sql (3.2)'
            - pkg: 'modernc.org/sqlite'
              desc: 'only apps/controller/internal/store may import the SQLite driver (3.2)'
            - pkg: 'github.com/pressly/goose'
              desc: 'only apps/controller/internal/store may run migrations (3.2)'

        # 3.2: the API reaches data through interfaces it declares itself.
        api-no-store:
          files: ['**/apps/controller/internal/api/**']
          deny:
            - pkg: 'github.com/luis-mc/ci-runners-shared-pool/apps/controller/internal/store'
              desc: 'apps/controller/internal/api must depend on an interface, not on apps/controller/internal/store (3.2)'

        # 3.3: one adapter module per external service SDK. Add an entry when an
        # SDK is adopted; the adapter package is created then, not before.
        github-confinement:
          files: ['**', '!**/apps/controller/internal/github/**']
          deny:
            - pkg: 'github.com/google/go-github'
              desc: 'the GitHub SDK belongs only in apps/controller/internal/github (3.3)'
            - pkg: 'github.com/actions/scaleset'
              desc: 'the scale set client belongs only in apps/controller/internal/github (3.3)'

        # R6.7 (observability): logs stay local. No logging, history or audit
        # package makes a network call; there is no telemetry and no remote sink.
        logs-stay-local:
          files:
            [
              '**/apps/controller/internal/logs/**',
              '**/apps/controller/internal/history/**',
              '**/apps/controller/internal/audit/**',
              '!$test',
            ]
          deny:
            - pkg: 'net'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'net/http'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'net/smtp'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'net/rpc'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'crypto/tls'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'connectrpc.com/connect'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'google.golang.org/grpc'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'github.com/luis-mc/ci-runners-shared-pool/apps/controller/internal/github'
              desc: 'logs, history and audit stay local (observability R6.7)'
            - pkg: 'github.com/luis-mc/ci-runners-shared-pool/apps/controller/internal/agentlink'
              desc: 'logs, history and audit stay local (observability R6.7)'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
