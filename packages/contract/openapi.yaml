      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    JobsLimit:
      name: limit
      in: query
      required: false
      description: Page size of the Jobs section; 25 when absent, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    JobRunner:
      name: runner
      in: query
      required: false
      description: The runner name (OPS34 D9).
      schema:
        type: string
    JobRunnerKind:
      name: runner_kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/RunnerKind'
    JobTypeFilter:
      name: job_type
      in: query
      required: false
      description: The job name without its matrix values, such as `test` (OPS34 D10).
      schema:
        type: string
    JobKeyFilter:
      name: job_ident
      in: query
      required: false
      schema:
        type: string
    JobBranchFilter:
      name: branch
      in: query
      required: false
      schema:
        type: string
    JobRunIdFilter:
      name: run_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Confirm:
      name: confirm
      in: query
      required: false
      description: The yes to a question card that named what goes (UX-62).
      schema:
        type: boolean
        default: false
    Confirmed:
      name: confirmed
      in: query
      required: false
      description: The yes to the Review step that named the running jobs (tray R5.16).
      schema:
        type: boolean
        default: false
    UserId:
      name: userId
      in: path
      required: true
      description: The numeric GitHub user id.
      schema:
        type: integer
        format: int64
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      description: The numeric GitHub repository id.
      schema:
        type: integer
        format: int64
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    MachineId:
      name: machineId
      in: path
      required: true
      schema:
        type: string
    ChangeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
    JoinCodeId:
      name: joinCodeId
      in: path
      required: true
      schema:
        type: string
    SetName:
      name: setName
      in: path
      required: true
      schema:
        type: string
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    BackupId:
      name: backupId
      in: path
      required: true
      schema:
        type: string
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
    RegistryImageId:
      name: registryImageId
      in: path
      required: true
      description: An image id of the pool registry, img_<random>.
      schema:
        type: string
    BuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
    CacheId:
      name: cacheId
      in: path
      required: true
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Any error, in the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExportFile:
      description: >-
        The export as a file. `Content-Disposition` carries the file name, named
        for what the file holds then the stamp (UX-39).
      headers:
        Content-Disposition:
          required: true
          schema:
            type: string
          example: attachment; filename="crsp-jobs-2026-11-14-1005.csv"
      content:
        text/csv:
          schema:
            type: string
        application/json:
          schema:
            type: string
        application/yaml:
          schema:
            type: string
    Redirect:
      description: A redirect. May set or clear a cookie.
      headers:
        Location:
          required: true
          schema:
            type: string
        Set-Cookie:
          schema:
            type: string

  schemas:
    SpeedStat:
      type: object
      required: [count, median_seconds, p95_seconds]
      properties:
        count: { type: integer }
        median_seconds: { type: number }
        p95_seconds: { type: number }
    SpeedSide:
      type: object
      required: [queue, run]
      properties:
        queue: { $ref: '#/components/schemas/SpeedStat' }
        run: { $ref: '#/components/schemas/SpeedStat' }
    SpeedRow:
      type: object
      required: [job, crsp, hosted, minutes_saved, cost_avoided_usd]
      properties:
        job: { type: string }
        crsp: { $ref: '#/components/schemas/SpeedSide' }
        hosted: { $ref: '#/components/schemas/SpeedSide' }
        minutes_saved: { type: number }
        cost_avoided_usd: { type: number }
    SpeedComparison:
      type: object
      required:
        [
          repository,
          days,
          since,
          excluded,
          rows,
          unmatched_jobs,
          total_minutes_saved,
          total_cost_avoided_usd,
        ]
      properties:
        repository: { type: string }
        days: { type: integer }
        since: { type: string, format: date-time }
        excluded: { type: boolean }
        reason: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SpeedRow' }
        unmatched_jobs: { type: integer }
        total_minutes_saved: { type: number }
        total_cost_avoided_usd: { type: number }
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      example:
        status: ok
        version: v0.1.0
    EnvVar:
      type: object
      required: [name, sensitive]
      properties:
        name: { type: string }
        value:
          type: string
          description: Absent for a sensitive variable.
        sensitive: { type: boolean }
    EnvSet:
      type: object
      required: [name, vars]
      properties:
        name: { type: string }
        vars:
          type: array
          items: { $ref: '#/components/schemas/EnvVar' }
    EnvSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EnvSet' }
    EnvVarInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        value: { type: string }
        sensitive: { type: boolean }
    EnvSetInput:
      type: object
      required: [vars]
      properties:
        vars:
          type: array
          items: { $ref: '#/components/schemas/EnvVarInput' }
    ResolvedEnvVar:
      type: object
      required: [name, value, sensitive, source]
      properties:
        name: { type: string }
        value:
          type: string
          description: '"***" for a sensitive variable.'
        sensitive: { type: boolean }
        source:
          type: string
          description: '"machine", "set:<name>" or "runner".'
    RunnerEnv:
      type: object
      required: [runner_id, vars]
      properties:
        runner_id: { type: string }
        vars:
          type: array
          items: { $ref: '#/components/schemas/ResolvedEnvVar' }
    RegistryLogin:
      type: object
      required: [kind, host, username]
      properties:
        kind:
          type: string
          enum: [container, vm, persistent]
        host: { type: string }
        username: { type: string }
    RegistryLoginInput:
      type: object
      required: [kind, host, username]
      properties:
        kind:
          type: string
          enum: [container, vm, persistent]
        host: { type: string }
        username: { type: string }
        password:
          type: string
          description: Write only. Empty keeps the stored one.
    CaBundleInput:
      type: object
      required: [pem]
      properties:
        pem: { type: string }
    RegistrySettings:
      type: object
      required: [logins, ca_bundle_set]
      properties:
        logins:
          type: array
          items: { $ref: '#/components/schemas/RegistryLogin' }
        ca_bundle_set: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      example:
        error:
          code: needs_confirmation
          message: Removing runner crsp-linux-1 waits for 1 running job.
          details:
            - kind: job
              id: '81234567'
              text: owner/app ci.yml test (started 14:05)
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
        message:
          type: string
          description: Human-readable text. Never contains secrets.
        details:
          type: array
          description: >-
            For needs_confirmation, each item that goes or job it waits for;
            for bad_request, each field problem.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          example: field
        id:
          type: string
        text:
          type: string

    # ---------- shared enums
    Role:
      type: string
      enum: [owner, admin, viewer]
    OS:
      type: string
      enum: [linux, windows, macos]
    Arch:
      type: string
      enum: [x64, arm64]
    Theme:
      type: string
      enum: [system, dark, light]
    RunnerKind:
      type: string
      enum: [persistent, ephemeral]
    Isolation:
      type: string
      enum: [microVM, VM, container, persistent]
    RunnerState:
      type: string
      description: >-
        What the runner really is (web-console UX-19). idle only when GitHub reports it online and
        not busy and its service runs; not_registered, stopped and unknown say why it is not.
      enum:
        [
          creating,
          idle,
          busy,
          draining,
          updating,
          offline,
          failed,
          removing,
          not_registered,
          stopped,
          unknown,
        ]
    MachineState:
      type: string
      description: active and drained are set by the user; draining while a drain waits.
      enum: [active, draining, drained, removing]
    BackendName:
      type: string
      enum: [persistent, docker, podman, nerdctl, wsl2, hyperv, kvm, tart, firecracker]
    JobResult:
      type: string
      enum: [success, failure, cancelled, timed_out, lost]
    WaitReason:
      type: string
      description: observability R5.5.
      enum:
        [
          free_slot,
          load_over_budget,
          no_runner_with_labels,
          repository_parallel_limit,
          machine_drained,
          load_not_measured,
          paused,
          on_battery,
          unknown,
        ]
    Severity:
      type: string
      enum: [ok, info, skip, warn, fail]
    VariableStatus:
      type: string
      enum: [ok, missing, wrong, not_managed]

    # ---------- setup and auth
    SetupState:
      type: object
      required: [has_app, has_owner, setup_link_redeemed, steps]
      properties:
        has_app:
          type: boolean
        has_owner:
          type: boolean
        setup_link_redeemed:
          type: boolean
          description: True when this browser holds a valid setup cookie.
        app:
          $ref: '#/components/schemas/GitHubApp'
        steps:
          type: object
          required: [connect_github, first_machine, first_repository]
          properties:
            connect_github:
              type: string
              enum: [todo, done]
            first_machine:
              type: string
              enum: [todo, done]
            first_repository:
              type: string
              enum: [todo, done]
      example:
        has_app: false
        has_owner: false
        setup_link_redeemed: true
        steps:
          connect_github: todo
          first_machine: todo
          first_repository: todo
    RedeemSetupLinkRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    StartAppManifestRequest:
      type: object
      required: [account_type, app_name, console_urls]
      properties:
        account_type:
          type: string
          enum: [user, organization]
        organization:
          type: string
          description: The organization login when account_type is organization.
        app_name:
          type: string
          example: crsp-home
        console_urls:
          type: array
          description: Console addresses; each gets `/auth/github/callback` (R5.4).
          items:
            type: string
          example: ['http://127.0.0.1:8460', 'https://pool.lan:8460']
    AppManifestForm:
      type: object
      required: [post_url, manifest, state]
      properties:
        post_url:
          type: string
          example: https://github.com/settings/apps/new?state=abc
        manifest:
          type: object
          additionalProperties: true
        state:
          type: string
    GitHubApp:
      type: object
      required: [id, slug, owner_login, html_url, webhook_active]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        owner_login:
          type: string
        html_url:
          type: string
        webhook_active:
          type: boolean
        permissions:
          type: object
          additionalProperties:
            type: string
      example:
        id: 1234567
        slug: crsp-home
        owner_login: luis-mc
        html_url: https://github.com/apps/crsp-home
        webhook_active: false
    CliLoginConfig:
      type: object
      required: [client_id, device_code_url, verification_url]
      properties:
        client_id:
          type: string
          example: Iv23liExample
        device_code_url:
          type: string
          example: https://github.com/login/device/code
        verification_url:
          type: string
          example: https://github.com/login/device
    ExchangeCliTokenRequest:
      type: object
      required: [github_credential, name]
      properties:
        github_credential:
          type: string
          description: The device-flow user token. Checked once and dropped.
        name:
          type: string
          description: A label for the token list, such as the host name.
          example: laptop
    AccessCredential:
      type: object
      required: [id, name, scope, created_by, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          $ref: '#/components/schemas/AccessScope'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    AccessScope:
      type: string
      enum: [parity]
      description: '`parity` is read only: the runner list and a doctor run.'
    AccessCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessCredential'
    AccessCredentialCreate:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
          maxLength: 80
        scope:
          $ref: '#/components/schemas/AccessScope'
    AccessCredentialCreated:
      type: object
      required: [value, info]
      properties:
        value:
          type: string
          description: The credential. Shown once.
        info:
          $ref: '#/components/schemas/AccessCredential'
    GithubGrant:
      type: object
      required: [ready, steps, missing]
      description: github-integration R5.86.
      properties:
        ready:
          type: boolean
          description: Every needed permission is accepted by the installation.
        next:
          type: string
          enum: [install, ask, accept]
          description: The first step that is not done. Absent when ready.
        missing:
          type: array
          description: The needed permissions that are not accepted yet, by GitHub's name.
          items:
            type: string
        installation_id:
          type: integer
          format: int64
        steps:
          type: array
          items:
            $ref: '#/components/schemas/GithubGrantStep'
    GithubGrantStep:
      type: object
      required: [id, done, permissions]
      properties:
        id:
          type: string
          enum: [install, ask, accept]
        done:
          type: boolean
        permissions:
          type: array
          description: The permissions still waiting at this step.
          items:
            type: string
        url:
          type: string
          description: The GitHub page of the step. Absent when the step has none.
    ParitySetupRequest:
      type: object
      description: No fields. The address is the controller's own, never one the browser sends (CRSP141).
    ListenAddressCandidate:
      type: object
      required: [id, label, who]
      properties:
        id:
          type: string
          enum: [pc, docker, other]
        label:
          type: string
        address:
          type: string
          description: host:port. Empty for the typed choice.
        who:
          type: string
          description: One line on who can reach it.
        recommended:
          type: boolean
    ListenAddress:
      type: object
      required: [running, from_env, candidates]
      properties:
        running:
          type: string
          description: The address the controller listens on now (host:port).
        stored:
          type: string
          description: The address chosen in the console, when there is one.
        from_env:
          type: boolean
          description: CRSP_LISTEN_ADDR is set and wins; the console cannot change it.
        env_name:
          type: string
        problem:
          type: string
          description: Why the controller did not listen on the stored address at start.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ListenAddressCandidate'
    ListenAddressChoice:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: host:port of this PC.
    SignInAddress:
      type: object
      required: [address, callback_url, registered]
      properties:
        address:
          type: string
          description: The console origin, such as https://192.168.1.162:8460.
        callback_url:
          type: string
          description: The exact callback URL to add to the GitHub App.
        app_url:
          type: string
          description: The App's settings page on GitHub, when the App is known.
        registered:
          type: boolean
          description: GitHub accepts the callback URL, so sign-in works on this address.
    ListenAddressChosen:
      type: object
      required: [address, restarting]
      properties:
        address:
          type: string
        restarting:
          type: boolean
    ParityAddress:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unreachable, needs_address]
        url:
          type: string
          description: The address that will be written as CRSP_URL. Empty with needs_address.
        problem:
          type: string
          description: Why the address does not answer, or why the controller has none.
        setting:
          type: string
          description: The setting to fix when the controller has no address a runner can reach.
    ParitySetup:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [done, needs_permission, needs_address]
        missing_permissions:
          type: array
          items:
            type: string
        grant:
          $ref: '#/components/schemas/GithubGrant'
        access_name:
          type: string
          description: The name of the repository Actions value that holds the access, CRSP_ACCESS.
        variable_names:
          type: array
          items:
            type: string
        access_id:
          type: string
          description: The id of the access credential that was made.
        address_problem:
          type: string
          description: With needs_address, why the controller has no address a runner can reach.
        address_setting:
          type: string
          description: With needs_address, the setting to fix.
    CliToken:
      type: object
      required: [id, name, user_id, user_login, created_at, expires_at]
      properties:
        id:
          type: string
        name:
          type: string
        user_id:
          type: integer
          format: int64
        user_login:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    CliTokenCreated:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: Shown once; the controller keeps only its hash.
        info:
          $ref: '#/components/schemas/CliToken'
    CliTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CliToken'
    ConsoleLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: The one-time console link. Shown once.
        expires_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [user, csrf, github_signin]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf:
          type: string
          description: Send as X-CSRF-Token on every change.
        github_signin:
          $ref: '#/components/schemas/GitHubSignIn'
      example:
        user:
          id: 583231
          login: luis-mc
          role: owner
          added_at: '2026-11-14T10:00:00Z'
        csrf: 5d1c0e
        github_signin:
          state: active
          expires_at: '2026-11-17T18:30:00Z'
    GitHubSignIn:
      type: object
      description: >-
        The user's GitHub sign-in. The GitHub token is held in memory only and
        lasts 8 hours; a controller restart or the 8 hours end it. The web session
        itself carries on (github-integration R6.2).
      required: [state]
      properties:
        state:
          type: string
          enum: [active, ended]
        expires_at:
          type: string
          format: date-time
          description: When the sign-in ends. Present when state is active and GitHub gave a limit.
    Preferences:
      type: object
      required: [theme]
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
      example:
        theme: dark

    # ---------- users
    User:
      type: object
      required: [id, login, role, added_at]
      properties:
        id:
          type: integer
          format: int64
          description: The numeric GitHub user id (R5.9).
        login:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        added_by:
          type: string
        added_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
      example:
        id: 583231
        login: luis-mc
        role: owner
        added_at: '2026-11-14T10:00:00Z'
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    AddUserRequest:
      type: object
      required: [login, role]
      properties:
        login:
          type: string
          example: octocat
        role:
          type: string
          enum: [admin, viewer]
    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        confirm:
          type: boolean
          description: Needed to hand over the owner role.

    # ---------- repositories
    Installation:
      type: object
      required: [id, account_login, account_type, suspended, repository_selection]
      properties:
        id:
          type: integer
          format: int64
        account_login:
          type: string
        account_type:
          type: string
          enum: [User, Organization]
        suspended:
          type: boolean
        repository_selection:
          type: string
          enum: [all, selected]
        missing_permissions:
          type: array
          description: github-integration R5.24.
          items:
            type: string
      example:
        id: 4455667
        account_login: luis-mc
        account_type: User
        suspended: false
        repository_selection: selected
    OrgPool:
      type: object
      required:
        [
          installation_id,
          organization,
          is_organization,
          eligible,
          enabled,
          group_name,
          repositories,
        ]
      properties:
        installation_id:
          type: integer
          format: int64
        organization:
          type: string
          description: The account login of the installation.
        is_organization:
          type: boolean
          description: False for a personal account, which keeps repository runners.
        eligible:
          type: boolean
          description: True when the pool per organization can be turned on.
        reason:
          type: string
          description: Why it cannot be turned on, when eligible is false.
        enabled:
          type: boolean
        group_name:
          type: string
          description: The runner group, named for the pool.
        group_id:
          type: integer
          format: int64
        repositories:
          type: array
          description: Full names of the repositories the runner group is visible to.
          items:
            type: string
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
      example:
        installation_id: 4455667
        organization: acme
        is_organization: true
        eligible: true
        enabled: true
        group_name: crsp-home
        group_id: 7
        repositories: [acme/api, acme/web]
    OrgPoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrgPool'
      example:
        items: []
    OrgPoolSet:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
      example:
        enabled: true
    InstallationList:
      type: object
      required: [items, stale]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Installation'
        stale:
          $ref: '#/components/schemas/Staleness'
    Staleness:
      type: object
      description: Set when GitHub did not answer and the last copy is shown (UX-53).
      required: [stale]
      properties:
        stale:
          type: boolean
        as_of:
          type: string
          format: date-time
        reason:
          type: string
          enum: [session_expired, permission_missing, unreachable, github_error]
          description: Why the list is the last copy (CRSP148, UX-28).
        status:
          type: integer
          description: The HTTP status GitHub answered with, when it answered.
        message:
          type: string
          description: What GitHub said, word for word, when it answered.
    AppHealth:
      type: object
      required: [gone]
      properties:
        gone:
          type: boolean
          description: True when GitHub says the App or its key is gone (R5.6).
        reason:
          type: string
          description: Why, in words for the page. Only when gone.
        checked_at:
          type: string
          format: date-time
          description: When GitHub last answered. Absent before the first answer.
    AppInstallUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://github.com/apps/crsp-home/installations/new
    TrialSet:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [off, observe, shadow, canary]
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Canary only. The share of jobs, chosen by job name.
        jobs:
          type: array
          items: { type: string }
          description: Canary only. Jobs that always use crsp.
        shadow_workflow:
          type: string
          description: Shadow only. The workflow file to dispatch.
        shadow_jobs:
          type: array
          items: { type: string }
          description: Shadow only. Jobs to copy; empty means every job crsp would take.
    TrialSide:
      type: object
      required: [runs, succeeded, avg_wait_sec, avg_run_sec]
      properties:
        runs: { type: integer }
        succeeded: { type: integer }
        avg_wait_sec: { type: integer }
        avg_run_sec: { type: integer }
    TrialJob:
      type: object
      required: [job, hosted, crsp, would_take]
      properties:
        job: { type: string }
        hosted: { $ref: '#/components/schemas/TrialSide' }
        crsp: { $ref: '#/components/schemas/TrialSide' }
        would_take: { type: integer }
        agree:
          type: boolean
          description: Present when the job ran on both sides.
    Trial:
      type: object
      required: [repository, mode, variables, total, hosted, crsp, jobs]
      properties:
        repository: { type: string }
        mode:
          type: string
          enum: [off, observe, shadow, canary]
        since: { type: string, format: date-time }
        percent: { type: integer }
        canary_jobs:
          type: array
          items: { type: string }
        shadow_workflow: { type: string }
        shadow_jobs:
          type: array
          items: { type: string }
        variables:
          type: array
          items: { type: string }
          description: The canary variables now written.
        total: { type: integer }
        hosted: { $ref: '#/components/schemas/TrialSide' }
        crsp: { $ref: '#/components/schemas/TrialSide' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/TrialJob' }
    Repository:
      type: object
      required:
        [
          id,
          full_name,
          owner,
          name,
          installation_id,
          visibility,
          pool_on,
          user_is_github_admin,
          user_admin_known,
          variables,
          policy,
        ]
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        owner:
          type: string
        name:
          type: string
        installation_id:
          type: integer
          format: int64
        visibility:
          type: string
          enum: [public, private, internal]
        default_branch:
          type: string
        pool_on:
          type: boolean
        pool_off_reason:
          type: string
          enum: [left_installation]
          description: >-
            Why the pool is off when the controller turned it off
            (github-integration R5.22). Absent otherwise.
        user_is_github_admin:
          type: boolean
          description: github-integration R5.19; without it the switch is disabled with this reason. Only a claim when user_admin_known is true.
        user_admin_known:
          type: boolean
          description: >-
            False when the controller could not read the user's admin rights (no
            GitHub sign-in in memory and the App could not say). Then
            user_is_github_admin means "not checked", not "not admin"
            (github-integration R5.19).
        variables:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryVariable'
        policy:
          $ref: '#/components/schemas/RepositoryPolicy'
        routing:
          $ref: '#/components/schemas/RepositoryRouting'
        ephemeral_capacity:
          type: boolean
          description: >-
            False when the repository's jobs go to ephemeral runners only and
            the pool has no machine that can make an ephemeral runner, so its
            jobs would wait (github-integration R5.60). Absent while the pool
            is off for the repository.
        webhook:
          $ref: '#/components/schemas/WebhookHealth'
        problem:
          $ref: '#/components/schemas/RepositoryProblem'
      example:
        id: 700100
        full_name: luis-mc/app
        owner: luis-mc
        name: app
        installation_id: 4455667
        visibility: private
        default_branch: main
        pool_on: true
        user_is_github_admin: true
        user_admin_known: true
        variables:
          - name: RUNS_ON_LINUX
            status: ok
            value: '["self-hosted","linux","x64"]'
        policy:
          priority: 0
          max_parallel_jobs: 2
          allow_fork_pull_requests: false
          labels: [self-hosted, linux, x64]
          runner_groups: []
    PublicRepositories:
      type: object
      required: [enabled, public_on_pool]
      properties:
        enabled:
          type: boolean
          description: False by default.
        changed_at:
          type: string
          format: date-time
          description: Absent when the setting was never changed.
        changed_by:
          type: string
          description: Login of who changed it last. Absent when never changed.
        public_on_pool:
          type: integer
          description: Public repositories whose pool is on now.
      example:
        enabled: false
        public_on_pool: 0
    PublicRepositoriesSet:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    PublicRepositoriesResult:
      allOf:
        - $ref: '#/components/schemas/PublicRepositories'
        - type: object
          required: [stopped]
          properties:
            stopped:
              type: integer
              description: Repositories whose pool this change switched off (0 when switching on).
    RepositoryProblem:
      type: object
      description: >-
        A fault the owner can fix on a repository (github-integration R5.56).
        Absent when there is none.
      required: [code, text, actions]
      properties:
        code:
          type: string
          enum: [public_pool_on_while_off]
        text:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryProblemAction'
    RepositoryProblemAction:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          enum: [turn_on_public_repositories, turn_off_pool]
        label:
          type: string
    WebhookHealth:
      type: object
      description: The last webhook delivery of a repository and how the controller learns about its jobs (github-integration R5.50).
      required: [mode, failures_in_a_row]
      properties:
        mode:
          type: string
          enum: [webhook, polling]
        last_delivery_at:
          type: string
          format: date-time
          description: Absent when no delivery was seen.
        last_result:
          type: string
          enum: [ok, failed, missed]
        failures_in_a_row:
          type: integer
        polling_since:
          type: string
          format: date-time
          description: Set in polling mode.
        webhooks_off:
          type: boolean
          description: True when the GitHub App has no webhook, so jobs are learned by polling only and no delivery can be missed (OPS22). Absent when webhooks are on.
    AppWebhook:
      type: object
      description: The webhook of the GitHub App as the console shows it (github-integration R5.51).
      required: [state]
      properties:
        state:
          type: string
          enum: [off, on, failing]
          description: Off means jobs are learned by polling. Failing means the newest delivery failed or was missed.
        address:
          type: string
          description: The public https address that forwards to the controller. Absent when off.
        last_delivery_at:
          type: string
          format: date-time
        last_result:
          type: string
          enum: [ok, failed, missed]
        events_link:
          type: string
          description: The App's permissions page at GitHub, set when the App does not subscribe to workflow_job.
    AppWebhookUpdate:
      type: object
      required: [address]
      additionalProperties: false
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 2048
          description: A public https address GitHub can reach, such as https://hooks.example.com.
    AppKeyUpload:
      type: object
      description: A new App private key, sent once and never returned (github-integration R5.7).
      required: [pem]
      additionalProperties: false
      properties:
        pem:
          type: string
          minLength: 1
          maxLength: 16384
          description: The file GitHub gives, in PEM form.
    WebhookModeUpdate:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [webhook]
    RepositoryRouting:
      type: object
      description: Where the jobs of a repository go now and why (github-integration R5.44). Absent while the pool is off for the repository.
      required: [where, why, used_minutes]
      properties:
        where:
          type: string
          enum: [crsp, hosted, waiting]
        why:
          type: string
          description: A code the console turns into words. machine_up, fallback_on, fallback_off, grace, cap_reached or public_repository.
          enum:
            [machine_up, fallback_on, fallback_off, grace, cap_reached, public_repository]
        oses:
          type: array
          description: The operating systems the reason is about.
          items:
            type: string
            enum: [linux, windows, macos]
        used_minutes:
          type: integer
          description: Fallback minutes counted this month (UTC), best effort.
      example:
        where: hosted
        why: fallback_on
        oses: [linux]
        used_minutes: 12
    RepositoryVariable:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          enum: [RUNS_ON_LINUX, RUNS_ON_WINDOWS, RUNS_ON_MACOS, RUNS_ON_LIGHT]
        status:
          $ref: '#/components/schemas/VariableStatus'
        value:
          type: string
          description: The JSON list of labels as written.
        written_at:
          type: string
          format: date-time
    RepositoryPolicy:
      type: object
      required:
        [priority, max_parallel_jobs, allow_fork_pull_requests, labels, runner_groups]
      properties:
        priority:
          type: integer
          description: Higher goes first (scheduling R5.8).
          minimum: -100
          maximum: 100
        max_parallel_jobs:
          type: integer
          minimum: 1
          maximum: 256
        allow_fork_pull_requests:
          type: boolean
        labels:
          type: array
          description: Generic labels only (github-integration R5.27).
          items:
            type: string
        runner_groups:
          type: array
          items:
            type: string
        runner_kinds:
          type: string
          enum: [ephemeral_only, any_runner]
          description: >-
            Which runners take this repository's jobs (github-integration
            R5.60). ephemeral_only: only a fresh container made for the job.
            any_runner: a persistent runner may take it too. The default is
            ephemeral_only for a public repository and any_runner for a
            private one; runner_kinds_set says whether the owner chose it.
        runner_kinds_set:
          type: boolean
          description: True when the owner chose runner_kinds; false while it is the default of the repository's visibility.
        legacy_vars:
          type: boolean
          description: Also write CI_RUNS_ON and CI_RUNS_ON_WINDOWS with the same labels as RUNS_ON_LINUX and RUNS_ON_WINDOWS, for workflows that still follow the old dev-standards templates (github-integration R5.39). Off by default; for the move from the old pool.
        budget_memory_pct:
          type: integer
          description: May lower the machine budget for this repository's jobs, never raise it (scheduling R5.4).
          minimum: 1
          maximum: 100
        budget_cpu_pct:
          type: integer
          minimum: 1
          maximum: 100
        extra_packages:
          type: array
          description: Extra distribution packages of the pool image (runners R5.51).
          items:
            type: string
        hosted_fallback:
          type: boolean
          description: Run on GitHub-hosted runners while no crsp machine can take the jobs (github-integration R5.42). Off by default; GitHub may bill those minutes for a private repository.
        fallback_cap_minutes:
          type: integer
          description: Monthly cap of fallback minutes; absent means no cap.
          minimum: 1
        hosted_labels:
          type: object
          description: The hosted label per operating system; a missing one is the default (ubuntu-latest, windows-latest, macos-latest).
          additionalProperties:
            type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    RepositoryPolicyUpdate:
      type: object
      properties:
        priority:
          type: integer
          minimum: -100
          maximum: 100
        max_parallel_jobs:
          type: integer
          minimum: 1
          maximum: 256
        allow_fork_pull_requests:
          type: boolean
        runner_kinds:
          type: string
          enum: [ephemeral_only, any_runner, default]
          description: Set which runners take the repository's jobs (github-integration R5.60). default clears the owner's choice, so the default of the visibility applies.
        legacy_vars:
          type: boolean
          description: Turn the old variable names CI_RUNS_ON and CI_RUNS_ON_WINDOWS on or off (github-integration R5.39).
        confirm_fork_risk:
          type: boolean
          description: Needed to turn fork jobs on (github-integration R5.26).
        hosted_fallback:
          type: boolean
          description: Turn the hosted fallback on or off (github-integration R5.42). A public repository is refused.
        confirm_fallback_cost:
          type: boolean
          description: The yes to the question that says GitHub may bill the fallback minutes. Needed to turn the fallback on.
        fallback_cap_minutes:
          type: integer
          minimum: 0
          description: Monthly cap of fallback minutes; 0 clears it.
        hosted_labels:
          type: object
          description: Hosted label per operating system (linux, windows, macos); an empty value puts the default back.
          additionalProperties:
            type: string
        labels:
          type: array
          items:
            type: string
        runner_groups:
          type: array
          items:
            type: string
        budget_memory_pct:
          type: integer
          minimum: 1
          maximum: 100
        budget_cpu_pct:
          type: integer
          minimum: 1
          maximum: 100
      example:
        priority: 10
        max_parallel_jobs: 3
    ExtraPackages:
      type: object
      required: [packages, text]
      properties:
        packages:
          type: array
          description: The names, sorted, without repeats.
          items:
            type: string
        text:
          type: string
          description: The names, one per line.
      example:
        packages: [libc++-dev, zlib1g-dev]
        text: "libc++-dev\nzlib1g-dev"
    ExtraPackagesUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The whole list, one name per line. Blank lines and lines that start with # are skipped.
          maxLength: 20000
      example:
        text: "zlib1g-dev\nlibc++-dev"
    RepositoryPage:
      type: object
      required: [items, stale]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
        next_cursor:
          type: string
        stale:
          $ref: '#/components/schemas/Staleness'
    PlanRepositoryChangesRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          items:
            type: object
            required: [repository_id, pool]
            properties:
              repository_id:
                type: integer
                format: int64
              pool:
                type: string
                enum: [on, off]
      example:
        changes:
          - repository_id: 700100
            pool: on
    RunsOnFinding:
      type: object
      required: [path, line, labels, kind, text]
      properties:
        path:
          type: string
          example: .github/workflows/ci.yml
        line:
          type: integer
        labels:
          type: array
          items:
            type: string
        kind:
          type: string
          enum: [no_runner_with_labels, not_generic, uses_variable, hosted]
        text:
          type: string
    RunsOnFindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunsOnFinding'
        checked_at:
          type: string
          format: date-time
    QueueSettings:
      type: object
      required: [order, fair_share, no_runner_wait_minutes]
      properties:
        order:
          type: array
          description: >-
            The order of service keys, first decides first (scheduling R5.8).
            Default priority, event_class, fair_share, queued_at.
          items:
            type: string
            enum: [priority, event_class, fair_share, queued_at]
        fair_share:
          type: boolean
          description: Round-robin by repository within a priority (scheduling R5.9).
        no_runner_wait_minutes:
          type: integer
          description: Minutes before "no runner with the labels" is raised (observability R5.5).
          minimum: 1
          maximum: 60
      example:
        order: [priority, event_class, fair_share, queued_at]
        fair_share: true
        no_runner_wait_minutes: 2

    # ---------- plans (repositories and runners)
    Plan:
      type: object
      description: >-
        A planned change. Nothing changes until it is applied. Each step names
        what it does; steps that delete need their own yes (UX-62).
      required: [id, area, state, created_at, created_by, steps]
      properties:
        id:
          type: string
        area:
          type: string
          enum: [repositories, runners]
        state:
          type: string
          enum: [planned, applying, done, failed, stopped, stale]
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlanStep'
      example:
        id: 01JCRSPPLAN0001
        area: runners
        state: planned
        created_at: '2026-11-14T10:00:00Z'
        created_by: luis-mc
        steps:
          - id: s1
            action: add_runner
            text: Add persistent runner crsp-linux-1 on machine box-1
            needs_yes: false
            state: planned
    PlanStep:
      type: object
      required: [id, action, text, needs_yes, state]
      properties:
        id:
          type: string
        action:
          type: string
          enum:
            [
              pool_on,
              pool_off,
              write_variable,
              delete_variable,
              add_runner,
              stop_old_service,
              remove_old_runner,
              delete_old_folder,
            ]
        text:
          type: string
        target:
          type: string
        needs_yes:
          type: boolean
        waits_for:
          type: string
          description: The step this one waits for, such as the new runner being online.
        state:
          type: string
          enum: [planned, running, done, failed, skipped, waiting]
        error:
          type: string
    ApplyPlanRequest:
      type: object
      required: [approved_steps]
      properties:
        approved_steps:
          type: array
          description: Ids of the steps the user said yes to.
          items:
            type: string
      example:
        approved_steps: [s1, s2]

    # ---------- machines
    MachineRecovery:
      type: object
      description: Present only when the agent of the machine needs recovery (operations R5.44, web-console R5.33).
      required: [state, reason, has, needs, since, armed]
      properties:
        state:
          type: string
          enum: [needs_recovery]
        reason:
          type: string
          enum: [old_protocol, stuck]
          description: old_protocol is an agent too old for the agent link; stuck is an agent that stayed on an old version for an hour after it was asked to update.
        has:
          type: string
          description: The version the agent runs.
        needs:
          type: string
          description: The version the controller runs.
        since:
          type: string
          format: date-time
        armed:
          type: boolean
          description: The owner pressed the action; the agent's next recovery call gets the update.
    Machine:
      type: object
      required:
        [
          id,
          name,
          os,
          arch,
          state,
          online,
          taking,
          is_controller,
          backends,
          settings,
          slots_used,
          last_seen_at,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        os:
          $ref: '#/components/schemas/OS'
        arch:
          $ref: '#/components/schemas/Arch'
        state:
          $ref: '#/components/schemas/MachineState'
        online:
          type: boolean
        accepting:
          type: boolean
          description: Whether the machine takes new jobs (machines R5.62). Another feature reads `online && accepting` to decide on hosted fallback. A machine that has reported nothing accepts.
        pause_reason:
          $ref: '#/components/schemas/PauseReason'
        taking:
          $ref: '#/components/schemas/MachineTaking'
        policy:
          $ref: '#/components/schemas/MachinePolicy'
        is_controller:
          type: boolean
          description: The controller's own machine (machines R5.1); it has no special path.
        container_os:
          $ref: '#/components/schemas/OS'
          description: The operating system the machine's container engine runs containers for (machines R5.18, runners R5.47), when the engine answers. A Windows machine with Docker Desktop on WSL2 says `linux`. Absent when the engine does not answer or the agent has not reported.
        facts:
          $ref: '#/components/schemas/MachineFacts'
        backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendSupport'
        settings:
          $ref: '#/components/schemas/MachineSettings'
        load:
          $ref: '#/components/schemas/Load'
        slots_used:
          type: integer
        running_jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        pending_change:
          $ref: '#/components/schemas/MachineChange'
        recovery:
          $ref: '#/components/schemas/MachineRecovery'
        docker_compact_status:
          $ref: '#/components/schemas/DockerCompactStatus'
        runner_problems:
          type: array
          description: Runner services on this machine that did not start after the agent gave their account the right to log on as a service again and tried once more (runners R5.89). Empty or absent while every runner service runs. The console shows a Problem banner for each until the service runs.
          items:
            $ref: '#/components/schemas/RunnerServiceProblem'
        last_seen_at:
          type: string
          format: date-time
        joined_at:
          type: string
          format: date-time
      example:
        id: m_01JCRSP0001
        name: box-1
        os: linux
        arch: x64
        state: active
        online: true
        is_controller: true
        backends:
          - name: persistent
            present: true
            usable: true
            allowed: true
        settings:
          budget_memory_pct: 85
          budget_cpu_pct: 60
          job_slots: 2
          light_slots: 1
          heavy_slots: 1
          allowed_backends: [persistent]
          drain_timeout_minutes: 60
          windows_symlink_right: false
        load:
          memory_pct: 41.5
          cpu_pct: 12.0
          memory_known: true
          cpu_known: true
          sampled_at: '2026-11-14T10:00:00Z'
          stale: false
        slots_used: 1
        last_seen_at: '2026-11-14T10:00:05Z'
    RunnerServiceProblem:
      type: object
      required: [runner, service, account, reason]
      properties:
        runner:
          type: string
          description: The runner's name.
        service:
          type: string
          description: The Windows service name.
        account:
          type: string
          description: The account the service runs as, for example `.\crsp-box-1`.
        reason:
          type: string
          description: Why the service did not start, as Windows said it, redacted.
        logon_right:
          type: boolean
          description: True when the account holds the right to log on as a service now, so the reason is something else.
    MachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
    MachineFacts:
      type: object
      description: machines R5.10.
      properties:
        host_name:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        kernel_version:
          type: string
        cpu_model:
          type: string
        cores:
          type: integer
        threads:
          type: integer
        memory_bytes:
          type: integer
          format: int64
        disk_total_bytes:
          type: integer
          format: int64
        disk_free_bytes:
          type: integer
          format: int64
        gpus:
          type: array
          items:
            type: object
            properties:
              vendor:
                type: string
              model:
                type: string
              memory_bytes:
                type: integer
                format: int64
        agent_version:
          type: string
        detected_at:
          type: string
          format: date-time
    BackendSupport:
      type: object
      description: machines R5.11 and R5.12.
      required: [name, present, usable, allowed]
      properties:
        name:
          $ref: '#/components/schemas/BackendName'
        present:
          type: boolean
        usable:
          type: boolean
        allowed:
          type: boolean
        version:
          type: string
        reason:
          type: string
          description: Why it is not usable, such as "no /dev/kvm".
        rootless:
          type: boolean
    MachineSettings:
      type: object
      description: machines R5.22, scheduling R5.1.
      required:
        [
          budget_memory_pct,
          budget_cpu_pct,
          job_slots,
          light_slots,
          heavy_slots,
          allowed_backends,
          drain_timeout_minutes,
          windows_symlink_right,
        ]
      properties:
        budget_memory_pct:
          type: integer
          minimum: 10
          maximum: 95
        budget_cpu_pct:
          type: integer
          minimum: 10
          maximum: 95
        job_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_slots:
          type: integer
          minimum: 0
          maximum: 64
        heavy_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_jobs:
          type: array
          items:
            type: string
        heavy_jobs:
          type: array
          items:
            type: string
        slot_max_age_minutes:
          type: integer
          minimum: 1
        gate_poll_seconds:
          type: integer
          minimum: 1
        gate_max_wait_minutes:
          type: integer
          minimum: 1
        gate_on_timeout:
          type: string
          enum: [fail, run]
        allowed_backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendName'
        cache_cap_bytes:
          type: integer
          format: int64
        drain_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        windows_symlink_right:
          type: boolean
          description: Owner decision for M1; grant "create symbolic links" to Windows runner accounts.
        pool_memory_gib:
          type: number
          format: double
          minimum: 0
          description: The memory in GiB the pool may use on this machine, set by the owner and checked against the load budget (machines R5.58). 0 means not set.
        pool_cpus:
          type: integer
          minimum: 0
          description: The CPUs the pool may use on this machine (machines R5.58). 0 means not set. Split over the job slots it gives CI_MAX_PARALLEL (runners R5.53).
        mode:
          $ref: '#/components/schemas/MachineMode'
        pause_on_battery:
          type: boolean
          description: Automatic pauses while the machine runs on battery. On by default; Always ignores it (machines R5.61, R5.63).
        cpu_cap_pct:
          $ref: '#/components/schemas/CpuCapPct'
        pause_until:
          type: string
          format: date-time
          description: A pause from the tray with a timer ends at this time. Absent when none runs (machines R5.61).
        pause_until_resumed:
          type: boolean
          description: A pause from the tray holds until Resume.
        docker_compact:
          $ref: '#/components/schemas/DockerCompactMode'
        docker_compact_threshold_gib:
          type: integer
          minimum: 0
          maximum: 100000
          description: How many GiB of Docker's disk file must be reclaimable (file size minus what Docker uses) before the compact runs. 0 takes 30 (caches R5.51 to R5.54).
        docker_compact_idle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: How many minutes no job may run or wait for the machine's runners. 0 takes 30 (caches R5.51 to R5.54).
    DockerCompactMode:
      type: string
      description: The automatic compact of Docker's disk file. auto (default) is on for a Windows machine with a Docker Desktop disk file and off elsewhere (caches R5.51 to R5.54).
      enum: [auto, 'on', 'off']
    DockerCompactStatus:
      type: object
      description: The Docker disk compact policy of one machine and what the agent reported about the disk file (caches R5.51 to R5.54). Read only.
      required: [enabled, running, can_compact, disk_present]
      properties:
        enabled:
          type: boolean
          description: The policy is on for this machine.
        reason:
          type: string
          description: Why the last look did not compact, or `run`. One of off, offline, not_active, no_report, no_admin, below_threshold, busy, not_idle_long_enough, done_today, already_running, change_open.
        running:
          type: boolean
        disk_present:
          type: boolean
          description: The agent found a Docker Desktop disk file.
        can_compact:
          type: boolean
          description: The agent has the administrator rights the compact needs.
        file_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        reclaimable_bytes:
          type: integer
          format: int64
        last_at:
          type: string
          format: date-time
        last_result:
          type: string
          description: Sizes of the last compact, or why it failed.
    MachineMode:
      type: string
      description: Automatic (default) takes jobs and pauses on battery and on a pause from the tray; Always ignores the battery; Paused takes no new job and finishes the running ones (machines R5.61).
      enum: [automatic, always, paused]
    CpuCapPct:
      type: integer
      description: The share of the whole machine's CPU the runner processes may use, in percent (machines R5.64). Separate from the load budget. 100 is no cap.
      enum: [25, 50, 75, 100]
    PauseReason:
      type: string
      description: Why a machine takes no new job (machines R5.62). Other features read these exact names.
      enum: [paused, on_battery, budget, base_image_missing]
    MachineTaking:
      type: object
      description: The one computed answer to "does this machine take new jobs" (machines R5.62, OPS29). The console state, the Now line, its note and the Stop or Resume button all read it. The controller decides from its own online flag, drain state, mode, tray pause and battery switch first, and from the agent's report only for what the agent alone knows.
      required: [taking_jobs]
      properties:
        taking_jobs:
          type: boolean
        reason:
          type: string
          description: Why not, absent while taking. offline; stopped (Stop new jobs from the console); mode_paused (mode Paused); tray_paused (a pause from the tray); on_battery (Automatic with the battery pause on); busy (load over the budget); base_image_missing; disk_low.
          enum:
            [
              offline,
              stopped,
              mode_paused,
              tray_paused,
              on_battery,
              busy,
              base_image_missing,
              disk_low,
            ]
    CpuCapState:
      type: string
      description: What the agent did with the CPU cap. not_supported is macOS (machines R5.64). applying is the wait until the agent reports the result for the chosen percent.
      enum: [applied, not_supported, failed, applying]
    MachinePolicy:
      type: object
      description: What the agent last reported about the power source and the CPU cap (machines R5.62 to R5.64).
      required: [battery_known, on_battery]
      properties:
        on_battery:
          type: boolean
        battery_known:
          type: boolean
          description: False when no battery reading was possible; the machine then counts as on mains.
        cpu_cap_state:
          $ref: '#/components/schemas/CpuCapState'
        cpu_cap_detail:
          type: string
          description: Why the cap is not applied, in words fit to show.
    PoolSizeCheckRequest:
      type: object
      required: [pool_memory_gib, pool_cpus]
      properties:
        pool_memory_gib:
          type: number
          format: double
          minimum: 0
        pool_cpus:
          type: integer
          minimum: 0
      example:
        pool_memory_gib: 16
        pool_cpus: 4
    PoolSizeRecommended:
      type: object
      required: [memory_gib, cpus]
      description: A recommended pool size. Memory is a share of the room rounded down to whole GiB, at least the floor; CPUs are the same share of the CPU budget, at most memory / 1.5, at least the floor.
      properties:
        memory_gib:
          type: integer
        cpus:
          type: integer
    PoolSizeCheck:
      type: object
      required:
        [known, ok, needs_shrink_confirm, nearest, current_memory_gib, current_cpus]
      properties:
        known:
          type: boolean
          description: False when the controller lacks the machine figures to check; `why` says what is missing.
        why:
          type: string
        ok:
          type: boolean
          description: The size fits and, when it is a shrink, needs only the explicit yes.
        needs_shrink_confirm:
          type: boolean
          description: The size is below the current one; saving needs confirm_shrink.
        reason:
          type: string
          description: Why it is refused, naming the budget that is short.
        short:
          type: string
          enum: [floor, cpu, memory, ratio, docker]
        nearest:
          type: array
          description: Sizes that pass, as sentences.
          items:
            type: string
        total_gib:
          type: number
          format: double
        used_outside_gib:
          type: number
          format: double
        memory_budget_gib:
          type: number
          format: double
        room_gib:
          type: number
          format: double
        cpu_budget:
          type: integer
        docker_ceiling_gib:
          type: number
          format: double
        decided:
          type: string
          description: The figure that decided.
        recommended_half:
          $ref: '#/components/schemas/PoolSizeRecommended'
        recommended_three_quarters:
          $ref: '#/components/schemas/PoolSizeRecommended'
        current_memory_gib:
          type: number
          format: double
        current_cpus:
          type: integer
      example:
        known: true
        ok: true
        needs_shrink_confirm: false
        nearest: []
        total_gib: 32
        used_outside_gib: 8
        memory_budget_gib: 27.2
        room_gib: 19.2
        cpu_budget: 4
        decided: fits
        current_memory_gib: 0
        current_cpus: 0
    MachineSettingsUpdate:
      type: object
      properties:
        name:
          type: string
        budget_memory_pct:
          type: integer
          minimum: 10
          maximum: 95
        budget_cpu_pct:
          type: integer
          minimum: 10
          maximum: 95
        job_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_slots:
          type: integer
          minimum: 0
          maximum: 64
        heavy_slots:
          type: integer
          minimum: 0
          maximum: 64
        light_jobs:
          type: array
          items:
            type: string
        heavy_jobs:
          type: array
          items:
            type: string
        gate_on_timeout:
          type: string
          enum: [fail, run]
        allowed_backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendName'
        cache_cap_bytes:
          type: integer
          format: int64
        drain_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        windows_symlink_right:
          type: boolean
        pool_memory_gib:
          type: number
          format: double
          minimum: 0
          description: The pool memory in GiB. Send it with pool_cpus. A size over the budget is refused with the budget that is short and the nearest sizes that fit (machines R5.58).
        pool_cpus:
          type: integer
          minimum: 0
          description: The pool CPUs. Send it with pool_memory_gib.
        mode:
          $ref: '#/components/schemas/MachineMode'
        pause_on_battery:
          type: boolean
        cpu_cap_pct:
          $ref: '#/components/schemas/CpuCapPct'
        docker_compact:
          $ref: '#/components/schemas/DockerCompactMode'
        docker_compact_threshold_gib:
          type: integer
          minimum: 0
          maximum: 100000
          description: How many GiB of Docker's disk file must be reclaimable (file size minus what Docker uses) before the compact runs. 0 takes 30 (caches R5.51 to R5.54).
        docker_compact_idle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: How many minutes no job may run or wait for the machine's runners. 0 takes 30 (caches R5.51 to R5.54).
        pause:
          type: string
          description: A pause from the tray or the console. one_hour pauses for an hour from now, until_resumed holds until none is sent, none ends a pause (machines R5.61).
          enum: [one_hour, until_resumed, none]
        confirm_shrink:
          type: boolean
          description: The explicit yes to a pool size below the current one. confirm does not stand for it (machines R5.58).
        confirm:
          type: boolean
          description: The yes once the jobs a restart waits for are named.
      example:
        job_slots: 3
        budget_cpu_pct: 70
    Load:
      type: object
      required: [memory_known, cpu_known, sampled_at, stale]
      properties:
        memory_pct:
          type: number
        cpu_pct:
          type: number
        memory_known:
          type: boolean
        cpu_known:
          type: boolean
        unknown_reason:
          type: string
        sampled_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: Older than 20 seconds (machines R6.7).
    LoadHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [at]
            properties:
              at:
                type: string
                format: date-time
              memory_pct:
                type: number
              cpu_pct:
                type: number
    DrainRequest:
      type: object
      properties:
        reason:
          type: string
    HostCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          minItems: 1
          description: The program and its arguments; run without a shell.
          items:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: How long the command may run. Default 1800.
    HostCommandResult:
      type: object
      required: [ok, exit_code, output]
      properties:
        ok:
          type: boolean
        exit_code:
          type: integer
          description: -1 when the command did not start or was stopped.
        output:
          type: string
          description: The last 64 KiB of the combined output, redacted.
        message:
          type: string
    MachineChange:
      type: object
      description: A change that waits for a drain (machines R5.30 to R5.33).
      required: [id, machine_id, kind, state, started_at, waiting_for]
      properties:
        id:
          type: string
        machine_id:
          type: string
        kind:
          type: string
          enum:
            [
              drain,
              settings,
              remove,
              agent_update,
              controller_update,
              runner_update,
              service_restart,
              image_rebuild,
            ]
        state:
          type: string
          enum: [waiting, running, done, cancelled, needs_you]
        started_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        waiting_for:
          type: array
          description: Only the jobs on the runners the change touches (machines R5.57).
          items:
            $ref: '#/components/schemas/Job'
        runner_names:
          type: array
          description: The runners the change touches. Empty means every runner of the machine (machines R5.57).
          items:
            type: string
        holder:
          $ref: '#/components/schemas/DrainHolder'
        choices:
          type: array
          description: >-
            The named choices the user has now. Offered when the drain is past its
            timeout or its holder is far past its usual duration. There is never a
            choice that stops a job (machines R5.33, R5.56).
          items:
            type: string
            enum: [wait_longer, cancel]
    DrainHolder:
      type: object
      description: The job that holds a drain longest, and how long it has run (machines R5.55).
      required: [job, running_seconds, over_usual]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        running_seconds:
          type: integer
        usual_seconds:
          type: integer
          description: The usual duration of this job from job history. Absent when there is no history.
        over_usual:
          type: boolean
          description: True when the job runs far past its usual duration (twice as long or more).
    MachineChangeDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [wait_longer, cancel, stop_jobs]
        wait_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        confirm:
          type: boolean
    CreateJoinCodeRequest:
      type: object
      properties:
        ttl_minutes:
          type: integer
          description: Default 15, ceiling 1440 (machines R5.4).
          minimum: 1
          maximum: 1440
    CreateJoinFileRequest:
      type: object
      required: [os]
      properties:
        os:
          type: string
          enum: [windows, linux, macos]
        ttl_minutes:
          type: integer
          description: Default 15, ceiling 1440 (machines R5.4).
          minimum: 1
          maximum: 1440
    SshJoinRequest:
      type: object
      required: [os, host, user, identity]
      properties:
        os:
          type: string
          enum: [linux, macos, windows]
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Default 22.
        user:
          type: string
        identity:
          type: string
          writeOnly: true
          description: The content of the SSH key file, used once for this join and never stored.
        host_fingerprint:
          type: string
          description: The host key fingerprint the owner confirmed (SHA256:...).
    JoinCode:
      type: object
      required: [id, state, created_at, expires_at]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [waiting, joined, expired, revoked]
        progress:
          type: string
          enum: [waiting, connected, ready]
          description: >-
            How far a copied or SSH join got (RES3). `waiting`: no agent used the
            code yet. `connected`: the agent joined. `ready`: the machine sent
            its first heartbeat. Absent once the code expired or was withdrawn.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        machine_id:
          type: string
          description: Set once an agent joined with it.
    JoinCodeCreated:
      type: object
      required: [code, join_code, commands]
      properties:
        code:
          type: string
          description: The one-time code, shown once.
        join_code:
          $ref: '#/components/schemas/JoinCode'
        commands:
          $ref: '#/components/schemas/InstallCommands'
    InstallCommands:
      type: object
      required: [controller_address, agent_port, cert_sha256, items]
      properties:
        controller_address:
          type: string
          example: pool.lan
        agent_port:
          type: integer
          example: 8461
        cert_sha256:
          type: string
          description: The controller certificate fingerprint the agent pins.
        items:
          type: array
          items:
            type: object
            required: [os, command]
            properties:
              os:
                $ref: '#/components/schemas/OS'
              command:
                type: string
    PoolSettings:
      type: object
      required:
        [
          budget_memory_pct,
          budget_cpu_pct,
          size_slots_from_machine,
          default_job_slots,
          drain_timeout_minutes,
        ]
      properties:
        budget_memory_pct:
          type: integer
          minimum: 10
          maximum: 95
        budget_cpu_pct:
          type: integer
          minimum: 10
          maximum: 95
        size_slots_from_machine:
          type: boolean
          description: Size a new machine's slots from its cores and memory within the budget.
        default_job_slots:
          type: integer
          minimum: 0
          maximum: 64
        drain_timeout_minutes:
          type: integer
          minimum: 5
          maximum: 1440
      example:
        budget_memory_pct: 85
        budget_cpu_pct: 60
        size_slots_from_machine: true
        default_job_slots: 2
        drain_timeout_minutes: 60

    # ---------- runners
    Runner:
      type: object
      required:
        [
          id,
          name,
          machine_id,
          machine_name,
          os,
          arch,
          kind,
          backend,
          isolation,
          labels,
          scope,
          state,
          managed,
          keeps_state,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        machine_id:
          type: string
        machine_name:
          type: string
          description: The name of the machine, as the Machines list shows it (UX-1).
        reason:
          type: string
          description: Why the runner is in a state that is not idle or busy (UX-19). Absent when there is nothing to say.
        os:
          $ref: '#/components/schemas/OS'
        arch:
          $ref: '#/components/schemas/Arch'
        kind:
          $ref: '#/components/schemas/RunnerKind'
        backend:
          $ref: '#/components/schemas/BackendName'
        isolation:
          $ref: '#/components/schemas/Isolation'
        labels:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/RunnerScope'
        runner_version:
          type: string
        state:
          $ref: '#/components/schemas/RunnerState'
        managed:
          type: boolean
          description: False for a runner not made by CRSP (runners R5.5).
        keeps_state:
          type: boolean
          description: True for a persistent runner (runners R5.7, UX-61).
        keep_dependencies:
          type: boolean
          description: Persistent runner only. True when its downloaded dependencies stay between jobs (runners R5.90). Absent for an ephemeral runner.
        dependency_cache_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Persistent runner only. Size of this runner's own dependency cache folder, as last measured (runners R5.90).
        unclean_reason:
          type: string
          description: >-
            Set when the clean-up after (or before) a job failed (runners R5.91).
            The runner takes no new job until it is clean. Absent when clean.
        failed_reason:
          type: string
          description: Whole plain reason the runner is in the failed state, with what the clean-up left behind. Only present when state is failed.
        github_runner_id:
          type: integer
          format: int64
        current_job:
          $ref: '#/components/schemas/Job'
        serving:
          type: string
          description: >-
            Pool runner only: the repository (owner/name) of the job it runs
            now. Absent when it is idle (runners R5.88).
        registrations:
          type: integer
          minimum: 0
          description: >-
            Pool runner only: how many hidden GitHub registrations it holds,
            one for each repository that uses the pool. Absent on other runners.
        created_at:
          type: string
          format: date-time
      example:
        id: r_01JCRSP0001
        name: crsp-linux-1
        machine_id: m_01JCRSP0001
        os: linux
        arch: x64
        kind: persistent
        backend: persistent
        isolation: persistent
        labels: [self-hosted, linux, x64]
        scope:
          kind: repository
          repository_id: 700100
        runner_version: 2.330.0
        state: idle
        managed: true
        keeps_state: true
    RunnerScope:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [repository, organization, pool]
          description: >-
            `pool` is a pool runner: a machine, a system and labels with no
            repository. Its GitHub registrations are hidden, one for each
            repository that uses the pool (runners R5.88).
        repository_id:
          type: integer
          format: int64
        organization:
          type: string
        runner_group:
          type: string
    RunnerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Runner'
    RunnerSettingsUpdate:
      type: object
      properties:
        keep_dependencies:
          type: boolean
    PlanRunnersRequest:
      type: object
      required: [os, kind, machine_id, count]
      properties:
        os:
          $ref: '#/components/schemas/OS'
        kind:
          $ref: '#/components/schemas/RunnerKind'
        machine_id:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 64
        labels:
          type: array
          items:
            type: string
        keep_dependencies:
          type: boolean
          description: >-
            Persistent runners only: keep downloaded dependencies (tool cache,
            package manager caches, browsers, image layers) between jobs.
            Default true. Temporary files of each job are always removed
            (runners R5.90, R5.91). Ignored for an ephemeral runner.
        scope:
          $ref: '#/components/schemas/RunnerScope'
          description: >-
            Leave it out to add pool runners (scope `pool`): the user adds
            runners per machine, never a repository (runners R5.88). For an
            ephemeral pool request `count` is the number of ephemeral runners
            that may run at once on the machine (a ceiling, not standing
            runners; runners R5.92).
      example:
        os: linux
        kind: persistent
        machine_id: m_01JCRSP0001
        count: 2
        labels: [self-hosted, linux, x64]

    # ---------- jobs, slots, live
    Job:
      type: object
