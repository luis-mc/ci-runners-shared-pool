              $ref: '#/components/schemas/Load'
            slots_used:
              type: integer
        runner:
          $ref: '#/components/schemas/Runner'
        doctor_run:
          $ref: '#/components/schemas/DoctorRun'
        plan:
          $ref: '#/components/schemas/Plan'
        change:
          $ref: '#/components/schemas/MachineChange'
        image:
          $ref: '#/components/schemas/Image'
        image_build:
          $ref: '#/components/schemas/ImageBuild'
        cache:
          $ref: '#/components/schemas/Cache'
        update:
          $ref: '#/components/schemas/UpdateStatus'
      example:
        id: '1042'
        type: machine.load
        at: '2026-11-14T10:00:05Z'
        load:
          machine_id: m_01JCRSP0001
          load:
            memory_pct: 41.5
            cpu_pct: 12
            memory_known: true
            cpu_known: true
            sampled_at: '2026-11-14T10:00:05Z'
            stale: false
          slots_used: 1

    # ---------- doctor
    DoctorScope:
      type: object
      properties:
        machines:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            type: integer
            format: int64
        checks:
          type: array
          items:
            type: string
    DoctorRun:
      type: object
      description: doctor 7.4.
      required: [id, trigger, state, started_at, counts, findings]
      properties:
        id:
          type: string
        trigger:
          type: string
          enum: [web, cli, schedule, system]
        state:
          type: string
          enum: [running, done, failed]
        scope:
          $ref: '#/components/schemas/DoctorScope'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        worst:
          $ref: '#/components/schemas/Severity'
        counts:
          type: object
          additionalProperties:
            type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DoctorFinding'
    RunnerLeftoverKind:
      type: string
      enum: [service, folder, account, download]
    RunnerLeftover:
      type: object
      description: One runner service, folder, local account or download that no runner of this controller owns (doctor R5.48).
      required: [kind, name, why]
      properties:
        kind:
          $ref: '#/components/schemas/RunnerLeftoverKind'
        name:
          type: string
          description: The service name, the account name, or the full path of a folder or file.
        path:
          type: string
        size_bytes:
          type: integer
          format: int64
        account:
          type: string
        why:
          type: string
          description: Why it is not owned, in words for people.
    RegistrationActionArgs:
      type: object
      description: What a registration action needs back (doctor R5.50).
      properties:
        runner_id:
          type: string
        github_runner_id:
          type: integer
          format: int64
        name:
          type: string
        installation_id:
          type: integer
          format: int64
        owner:
          type: string
        repo:
          type: string
        organization:
          type: string
    RemoveRegistrationRequest:
      type: object
      required: [action, args]
      properties:
        action:
          type: string
          enum: [remove_github_runner, remove_runner_record]
        args:
          $ref: '#/components/schemas/RegistrationActionArgs'
    RemoveRegistrationResult:
      type: object
      required: [removed, name]
      properties:
        removed:
          type: boolean
        name:
          type: string
    RemoveRunnerLeftoversRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [kind, name]
            properties:
              kind:
                $ref: '#/components/schemas/RunnerLeftoverKind'
              name:
                type: string
    RemoveRunnerLeftoversResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [kind, name, outcome, steps]
            properties:
              kind:
                $ref: '#/components/schemas/RunnerLeftoverKind'
              name:
                type: string
              outcome:
                type: string
                enum: [removed, already_gone, refused, failed]
              error:
                type: string
              steps:
                type: array
                items:
                  type: string
    DoctorFinding:
      type: object
      required: [check, subject, severity, title, fix, needs_admin, milestone, checked_at]
      properties:
        check:
          type: string
          example: workflow.labels
        subject:
          type: object
          required: [kind, id, name]
          properties:
            kind:
              type: string
            id:
              type: string
            name:
              type: string
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
        detail:
          type: string
        fix:
          type: object
          required: [text]
          properties:
            text:
              type: string
            command:
              type: string
            link:
              type: string
        needs_admin:
          type: boolean
        items:
          type: array
          description: The things the finding lists, for example the runner leftovers of a machine (doctor R5.48).
          items:
            $ref: '#/components/schemas/RunnerLeftover'
        action:
          type: object
          description: The one button the finding offers. `remove_runner_leftovers` removes `items` through POST /api/v1/machines/{machineId}/runner-leftovers/remove (the subject is the machine). `remove_github_runner` and `remove_runner_record` send `args` through POST /api/v1/doctor/registration-fixes.
          required: [id, label]
          properties:
            id:
              type: string
              enum: [remove_runner_leftovers, remove_github_runner, remove_runner_record]
            label:
              type: string
            args:
              $ref: '#/components/schemas/RegistrationActionArgs'
        milestone:
          type: integer
        checked_at:
          type: string
          format: date-time
      example:
        check: workflow.labels
        subject:
          kind: repository
          id: '700100'
          name: luis-mc/app
        severity: fail
        title: No online runner carries [self-hosted, linux, arm64]
        detail: .github/workflows/ci.yml:12 needs [self-hosted, linux, arm64]
        fix:
          text: Add a runner with these labels, or use fromJSON(vars.RUNS_ON_LINUX).
          link: /runners
        needs_admin: false
        milestone: 1
        checked_at: '2026-11-14T10:00:12Z'
    DoctorFindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DoctorFinding'
        last_run_at:
          type: string
          format: date-time

    # ---------- settings and audit
    Settings:
      type: object
      description: observability R6.8 retention (days unless named), operations R5.21 backup time.
      properties:
        retention_job_history_days:
          type: integer
          minimum: 7
          maximum: 400
        retention_logs_days:
          type: integer
          minimum: 1
          maximum: 90
        retention_logs_mib_per_machine:
          type: integer
          minimum: 64
          maximum: 10240
        retention_audit_days:
          type: integer
          minimum: 90
          maximum: 1825
        retention_load_raw_hours:
          type: integer
          minimum: 1
          maximum: 168
        backup_time_local:
          type: string
          description: HH:MM, 24-hour local time.
          example: '03:00'
        backup_keep_days:
          type: integer
          minimum: 1
          maximum: 365
        max_event_streams:
          type: integer
          minimum: 1
          maximum: 200
        fallback_grace_minutes:
          type: integer
          minimum: 1
          maximum: 60
          description: github-integration R5.43. How long no crsp machine of an operating system must have been up before a repository that turned the hosted fallback on runs on GitHub-hosted runners. Default 3.
        insights_keep_ci_data:
          type: boolean
          description: ci-run-insights R5.5. Keep CI logs and test reports on the owner's machines (owner decision D4). On by default.
        insights_ci_data_days:
          type: integer
          minimum: 7
          maximum: 365
          description: ci-run-insights R5.5, R6.2. Default 30.
        insights_ci_data_mib_per_repository:
          type: integer
          minimum: 64
          maximum: 20480
          description: ci-run-insights R5.5, R6.2. Default 1024.
        insights_test_results_days:
          type: integer
          minimum: 14
          maximum: 400
          description: ci-run-insights R5.5, R6.2. Default 90.
        insights_resource_samples_days:
          type: integer
          minimum: 1
          maximum: 30
          description: ci-run-insights R5.5, R6.2. Default 7.
        insights_hold_cap_seconds:
          type: integer
          minimum: 30
          maximum: 900
          description: ci-run-insights R5.14. Default 120.
        insights_guardrail_artifact:
          type: string
          maxLength: 100
          description: ci-run-insights R5.31. Name pattern of the guard report artifact. Default test-guardrails*.
        insights_update_period:
          type: string
          enum: [every_run, every_nth_run, hourly]
          description: ci-run-insights R5.44 (owner decisions D18, D19). How often insights are re-analysed. every_run (the default) analyses after each CI run; every_nth_run after every Nth run; hourly once an hour. The cost warning recommends a slower one.
        insights_update_every_n_runs:
          type: integer
          minimum: 2
          maximum: 50
          description: ci-run-insights R5.44. N of every_nth_run. Default 5.
        auto_update:
          type: boolean
          description: operations R5.15. On by default. When on, a newer stable release installs by itself after a drain. When off, the console Review step asks first.
      example:
        retention_job_history_days: 90
        retention_logs_days: 14
        retention_logs_mib_per_machine: 512
        retention_audit_days: 400
        retention_load_raw_hours: 24
        backup_time_local: '03:00'
        backup_keep_days: 14
        max_event_streams: 50
        fallback_grace_minutes: 3
        auto_update: true
    UpdateStatus:
      type: object
      description: operations R5.11 to R5.18, tray R5.18.
      required: [current_version, update_available, state, auto_update, running_jobs]
      properties:
        current_version:
          type: string
          example: 1.4.0
        latest_version:
          type: string
          description: The newest stable release found; absent before the first look.
        update_available:
          type: boolean
        state:
          type: string
          enum:
            [
              idle,
              checking,
              waiting_for_jobs,
              downloading,
              installing,
              restarting,
              failed,
            ]
          description: waiting_for_jobs is the drain. failed carries `error`.
        auto_update:
          type: boolean
        checked_at:
          type: string
          format: date-time
        error:
          type: string
          description: Which check or step failed, in words.
        running_jobs:
          type: array
          description: Jobs running on this machine that the drain waits for.
          items:
            $ref: '#/components/schemas/UpdateJob'
        drain_timeout_minutes:
          type: integer
        release_url:
          type: string
          format: uri
        stage:
          $ref: '#/components/schemas/UpdateStage'
        attempt:
          $ref: '#/components/schemas/UpdateAttempt'
        error_attempt:
          type: string
          description: The id of the attempt that `error` belongs to. Absent for a failure recorded before attempts had ids. A page shows an error only when this is the id of the attempt it started (CRSP205).
        service_started_at:
          type: string
          format: date-time
          description: When this service process started. A restart is over when it is later than the attempt's started_at (CRSP205).
        server_time:
          type: string
          format: date-time
          description: The service's clock now, so a page can say how long a restart took without its own clock.
      example:
        current_version: 1.4.0
        latest_version: 1.5.0
        update_available: true
        state: idle
        auto_update: true
        running_jobs: []
    UpdateAttempt:
      type: object
      description: One update or restart, from the yes to its end. Its id tells a page which outcome is its own (CRSP205).
      required: [id, kind, started_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [update, restart]
        started_at:
          type: string
          format: date-time
    UpdateStage:
      type: object
      description: The live stage of the last or running update (TRAY4). It is kept in a file, so it survives the service restart.
      required: [name, at]
      properties:
        name:
          type: string
          enum:
            [
              downloading,
              waiting_for_jobs,
              installing,
              waiting_installer,
              restarting,
              done,
              failed,
            ]
          description: waiting_installer means another installer holds Windows Installer; the update starts when it ends (TRAY11). restarting is set only once the installer has finished.
        waiting_for:
          type: string
          description: waiting_installer only, the name of the other installer when it is known.
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Only for downloading and installing; absent when the stage has no number. Installing is a rough guess from the installer log.
        version:
          type: string
          description: The version being installed; for done, the version that runs.
        error:
          type: string
          description: failed only, in words.
        log_path:
          type: string
          description: failed only, the log that has the detail.
        failed_at:
          type: string
          enum: [downloading, waiting_for_jobs, installing, waiting_installer, restarting]
          description: failed only, the stage that failed.
        at:
          type: string
          format: date-time
    UpdateJob:
      type: object
      required: [repository, run_id, job]
      properties:
        repository:
          type: string
        workflow:
          type: string
        run_id:
          type: integer
          format: int64
        job:
          type: string
    AuditEvent:
      type: object
      description: observability R5.24.
      required: [id, at, actor, source, action, target_type, target_id, summary, result]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: GitHub login, `system`, or the machine for agent actions.
        actor_id:
          type: string
        source:
          type: string
          enum: [web, cli, tray, api, agent, system]
        action:
          type: string
          example: machine.drain
        target_type:
          type: string
        target_id:
          type: string
        summary:
          type: string
          description: Short before-and-after summary; redacted.
        result:
          type: string
          enum: [done, refused]
      example:
        id: 77
        at: '2026-11-14T10:00:00Z'
        actor: luis-mc
        actor_id: '583231'
        source: web
        action: machine.drain
        target_type: machine
        target_id: m_01JCRSP0001
        summary: state active -> draining
        result: done
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string

    # ---------- backups
    Backup:
      type: object
      required: [id, file, created_at, state]
      properties:
        id:
          type: string
        file:
          type: string
          example: crsp-backup-2026-11-14-0300.tar.gz
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
        schema_version:
          type: integer
          format: int64
        state:
          type: string
          enum: [writing, good, failed]
        check_result:
          type: string
          description: PRAGMA integrity_check result.
    BackupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
        last_drill:
          $ref: '#/components/schemas/BackupDrill'
    BackupDrill:
      type: object
      required: [id, started_at, state]
      properties:
        id:
          type: string
        backup_id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [running, passed, failed]
        detail:
          type: string

    # ---------- images and caches (CRSP32)
    ImageTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: node
        version:
          type: string
          example: '26'
    LayerNeededBy:
      type: object
      description: The repositories on the machine that ask for a layer (LOOK12).
      required: [count, repositories, failing]
      properties:
        count:
          type: integer
        repositories:
          type: array
          items:
            type: string
          description: Full names of the repositories.
        failing:
          type: integer
          description: Repositories whose recent job failed for lack of the layer.
    ImageExtraPackages:
      type: object
      required: [repository, packages]
      properties:
        repository:
          type: string
        packages:
          type: array
          items:
            type: string
    ImageLayer:
      type: object
      required: [id, name, enabled, size_bytes, adds, purpose, needed_by]
      properties:
        adds:
          type: array
          description: The tools the layer adds to the base.
          items:
            $ref: '#/components/schemas/ImageTool'
        purpose:
          type: string
          description: One line, completes "Pick it when".
        needed_by:
          $ref: '#/components/schemas/LayerNeededBy'
        id:
          type: string
          example: browsers
        name:
          type: string
          example: Browsers for Playwright
        enabled:
          type: boolean
        size_bytes:
          type: integer
          format: int64
    Image:
      type: object
      description: One image on one machine (runners R5.32 and R5.33).
      required:
        [
          id,
          machine_id,
          os,
          base,
          base_tools,
          extra_packages,
          layers,
          size_bytes,
          state,
          newest,
        ]
      properties:
        base_tools:
          type: array
          description: What every image on the machine holds, always.
          items:
            $ref: '#/components/schemas/ImageTool'
        extra_packages:
          type: array
          description: Extra packages per repository on the machine.
          items:
            $ref: '#/components/schemas/ImageExtraPackages'
        id:
          type: string
        machine_id:
          type: string
        os:
          $ref: '#/components/schemas/OS'
        base:
          type: string
          description: The base image.
          example: ubuntu-24.04
        layers:
          type: array
          items:
            $ref: '#/components/schemas/ImageLayer'
        size_bytes:
          type: integer
          format: int64
        built_at:
          type: string
          format: date-time
        newest:
          type: boolean
          description: True for the newest image kept for this machine and OS.
        needs_rebuild:
          type: boolean
          description: The saved layers differ from the built ones.
        state:
          type: string
          enum: [ready, rebuilding, failed, not_built]
        error:
          type: string
          description: Why the last build failed; the old image keeps serving.
      example:
        id: img_01JCRSP0001
        machine_id: m_01JCRSP0001
        os: linux
        base: ubuntu-24.04
        base_tools:
          - name: Ubuntu
            version: '24.04'
          - name: git
        extra_packages:
          - repository: luis-mc/app
            packages: [libssl-dev]
        layers:
          - id: kvm
            name: KVM virtual machines
            enabled: true
            size_bytes: 612368384
            adds:
              - name: qemu-system-x86_64
            purpose: your jobs boot a virtual machine with qemu
            needed_by:
              count: 1
              repositories: [luis-mc/app]
              failing: 0
        size_bytes: 2147483648
        built_at: '2026-11-13T22:00:00Z'
        newest: true
        needs_rebuild: false
        state: ready
    ImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
    UpdateImageLayersRequest:
      type: object
      required: [enabled_layers]
      properties:
        enabled_layers:
          type: array
          description: Ids of the layers that are on. Every other layer is off.
          items:
            type: string
      example:
        enabled_layers: [build-tools, browsers]
    CacheKind:
      type: string
      description: >-
        `tool_cache` and `rust_cache` are the per-runner folders of milestone 1
        (caches R5.36, R5.39); the others arrive with later milestones.
      enum:
        [
          actions_cache,
          git_mirror,
          tool_cache,
          registry_mirror,
          rust_cache,
          dependency_cache,
        ]
    Cache:
      type: object
      description: One cache on one machine (caches R5.8 to R5.14).
      required: [id, kind, machine_id, size_bytes, state]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/CacheKind'
        machine_id:
          type: string
        runner_id:
          type: string
          description: The runner whose folder this is, for a per-runner cache.
        runner_name:
          type: string
          description: The runner's name, for a per-runner cache.
        size_bytes:
          type: integer
          format: int64
        cap_bytes:
          type: integer
          format: int64
          description: Absent when the cache has no cap.
        entry_count:
          type: integer
        last_wiped_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [ready, wiping]
        waiting_for:
          type: array
          description: The running jobs a wiping cache waits for (caches R5.32).
          items:
            type: string
        error:
          type: string
          description: Why the last wipe failed; nothing more was deleted.
      example:
        id: cch_01JCRSP0001
        kind: tool_cache
        machine_id: m_01JCRSP0001
        size_bytes: 3221225472
        cap_bytes: 10737418240
        entry_count: 42
        state: ready
    CacheList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cache'

    # ---------- notifications (CRSP32)
    NotificationEvent:
      type: string
      description: The stable event types of notifications R5.1.
      enum:
        [
          machine.offline,
          job.waiting,
          disk.low,
          runner.outdated,
          doctor.finding,
          update.available,
        ]
    NotificationKind:
      type: string
      enum: [email, webhook, desktop]
    NotificationSeverity:
      type: string
      description: The lowest doctor severity the channel gets (notifications R5.4).
      enum: [info, warning, error]
    SmtpSettings:
      type: object
      description: How an email channel sends. The password is never returned.
      required: [host, port, has_password]
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        from:
          type: string
        has_password:
          type: boolean
    NotificationChannel:
      type: object
      description: >-
        One channel. No secret is returned: `secret_set` and `smtp.has_password`
        say only whether one is set.
      required: [id, kind, name, scope, enabled, events, min_severity, secret_set]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/NotificationKind'
        name:
          type: string
        scope:
          type: string
          enum: [personal, pool]
          description: Email and desktop are personal; a webhook is pool-wide.
        enabled:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEvent'
        min_severity:
          $ref: '#/components/schemas/NotificationSeverity'
        address:
          type: string
          description: Email address (kind email).
        url:
          type: string
          description: HTTPS URL (kind webhook).
        secret_set:
          type: boolean
          description: A webhook signing secret is set. Always false for other kinds.
        smtp:
          $ref: '#/components/schemas/SmtpSettings'
        last_test_at:
          type: string
          format: date-time
        last_test_ok:
          type: boolean
      example:
        id: nch_01JCRSP0001
        kind: webhook
        name: Team chat
        scope: pool
        enabled: true
        events: [machine.offline, job.waiting]
        min_severity: warning
        url: https://hooks.example.com/crsp
        secret_set: true
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
    NotificationChannelInput:
      type: object
      required: [kind, name, events]
      properties:
        kind:
          $ref: '#/components/schemas/NotificationKind'
        name:
          type: string
        enabled:
          type: boolean
          default: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEvent'
        min_severity:
          $ref: '#/components/schemas/NotificationSeverity'
        address:
          type: string
        url:
          type: string
        secret:
          type: string
          writeOnly: true
          description: Webhook signing secret. Write-only.
        smtp:
          type: object
          required: [host, port]
          properties:
            host:
              type: string
            port:
              type: integer
            username:
              type: string
            from:
              type: string
            password:
              type: string
              writeOnly: true
              description: SMTP password. Write-only.
      example:
        kind: webhook
        name: Team chat
        events: [machine.offline]
        min_severity: warning
        url: https://hooks.example.com/crsp
        secret: '<webhook signing secret>'
    NotificationChannelUpdate:
      type: object
      description: Every field is optional; `kind` cannot change.
      properties:
        name:
          type: string
        enabled:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEvent'
        min_severity:
          $ref: '#/components/schemas/NotificationSeverity'
        address:
          type: string
        url:
          type: string
        secret:
          type: string
          writeOnly: true
          description: New signing secret; an empty string removes it.
        smtp:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
            username:
              type: string
            from:
              type: string
            password:
              type: string
              writeOnly: true
              description: New SMTP password; an empty string removes it.
    NotificationTestResult:
      type: object
      required: [ok, sent_at]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: What happened, or why delivery failed.
        sent_at:
          type: string
          format: date-time

    # ---------- updates (CRSP32)

    # ---------- image registry (REG10 contract, docs/features/registry)
    RegistryImageKind:
      type: string
      enum: [standard, custom]
    RegistryImageState:
      type: string
      description: registry R5.29. staged and refused are shown only on the image page.
      enum: [staged, refused, current, variant, superseded, deleted]
    RegistryArch:
      type: string
      enum: [amd64, arm64]
    RegistryScanState:
      type: string
      enum: [not_scanned, queued, scanning, done, failed]
    RegistryDecider:
      type: string
      description: owner waits for a yes; crsp acts alone on due_at.
      enum: [owner, crsp]
    RegistryRule:
      type: string
      enum: [replace, superseded, variant, unused, over_budget, dangling, profile_removed]
    RegistryOverview:
      type: object
      required: [where, budgets, last_7_days, recommendations, images, in_flight]
      properties:
        where:
          $ref: '#/components/schemas/RegistryWhere'
        budgets:
          type: array
          items: { $ref: '#/components/schemas/RegistryBudget' }
        last_7_days:
          $ref: '#/components/schemas/RegistryWeek'
        recommendations:
          type: array
          description: Owner's-yes rules first, then crsp's by due date. None can be dismissed.
          items: { $ref: '#/components/schemas/RegistryRecommendation' }
        images:
          type: object
          required: [standard, custom]
          properties:
            standard: { type: integer }
            custom: { type: integer }
        in_flight:
          type: object
          required: [builds, pulls, pushes]
          properties:
            builds: { type: integer }
            pulls: { type: integer }
            pushes: { type: integer }
        last_cleanup:
          $ref: '#/components/schemas/RegistryCleanup'
        next_cleanup_at:
          type: string
          format: date-time
    RegistryWhere:
      type: object
      required: [host, folder, read_only, running]
      properties:
        host:
          type: string
          description: host:port on the controller's HTTPS listener (private LAN address only).
        folder:
          type: string
        read_only:
          type: boolean
          description: True during the cleanup window; pulls keep working.
        running:
          type: boolean
        why_not:
          type: string
          description: Why it is not running, in plain words.
    RegistryWeek:
      type: object
      required: [pulls, builds_avoided, saved_seconds, bytes_pulled]
      properties:
        pulls: { type: integer }
        builds_avoided: { type: integer }
        saved_seconds: { type: number }
        bytes_pulled: { type: integer, format: int64 }
    RegistryBudget:
      type: object
      required: [kind, limit_bytes, used_bytes, shared_bytes, over]
      properties:
        kind:
          $ref: '#/components/schemas/RegistryImageKind'
        limit_bytes: { type: integer, format: int64 }
        used_bytes: { type: integer, format: int64 }
        shared_bytes:
          type: integer
          format: int64
          description: Layers shared with the other kind, counted once against the oldest image's kind.
        over: { type: boolean }
    RegistryBudgets:
      type: object
      required: [standard, custom, free_disk_bytes, max_total_bytes]
      properties:
        standard:
          $ref: '#/components/schemas/RegistryBudget'
        custom:
          $ref: '#/components/schemas/RegistryBudget'
        free_disk_bytes: { type: integer, format: int64 }
        max_total_bytes:
          type: integer
          format: int64
          description: Half the free disk plus what the registry holds now; the two limits may not add up to more.
    RegistryBudgetsInput:
      type: object
      required: [standard_bytes, custom_bytes]
      properties:
        standard_bytes: { type: integer, format: int64, minimum: 0 }
        custom_bytes: { type: integer, format: int64, minimum: 0 }
    RegistryRecommendation:
      type: object
      required: [id, rule, decider, frees_bytes, created_at]
      properties:
        id: { type: string }
        rule:
          $ref: '#/components/schemas/RegistryRule'
        image_id: { type: string }
        image:
          description: The image `image_id` names, so a screen needs no second call to name it.
          allOf:
            - $ref: '#/components/schemas/RegistryImageSummary'
        other_image_id:
          type: string
          description: For replace, the image the new one would replace.
        kind:
          $ref: '#/components/schemas/RegistryImageKind'
        frees_bytes: { type: integer, format: int64 }
        decider:
          $ref: '#/components/schemas/RegistryDecider'
        due_at:
          type: string
          format: date-time
          description: When crsp acts alone, shown ahead. Absent when the owner decides.
        created_at:
          type: string
          format: date-time
    RegistryImageSummary:
      type: object
      required:
        [
          id,
          kind,
          name,
          key,
          profile,
          arch,
          state,
          manifest_digest,
          size_bytes,
          unique_bytes,
          pulls_7_days,
          scan_state,
          pushed_at,
        ]
      properties:
        id: { type: string }
        kind:
          $ref: '#/components/schemas/RegistryImageKind'
        name:
          type: string
          description: crsp/std/<profile> or crsp/custom/<owner>-<repo>/<profile>.
        key:
          type: string
          description: The image key, 12 hex; lists show the first 6. It is also the tag.
        profile: { type: string }
        arch:
          $ref: '#/components/schemas/RegistryArch'
        state:
          $ref: '#/components/schemas/RegistryImageState'
        manifest_digest: { type: string }
        source_repository: { type: string }
        branch:
          type: string
          description: Empty for the default branch.
        size_bytes: { type: integer, format: int64 }
        unique_bytes: { type: integer, format: int64 }
        pulls_7_days: { type: integer }
        last_pull_at:
          type: string
          format: date-time
        keep_until:
          type: string
          format: date-time
        scan_state:
          $ref: '#/components/schemas/RegistryScanState'
        pushed_at:
          type: string
          format: date-time
        update_found:
          type: boolean
          description: A newer image updates this one (an open replace recommendation).
        unused_days:
          type: integer
          description: Whole days since the last pull (the push when never pulled). Present only while an open `unused` recommendation names the image.
    RegistryImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegistryImageSummary' }
    RegistryImage:
      allOf:
        - $ref: '#/components/schemas/RegistryImageSummary'
        - type: object
          required: [lineage, layers, pulls_by_day, machines, pointers]
          properties:
            stack_hash: { type: string }
            base_name: { type: string }
            base_digest: { type: string }
            commit: { type: string }
            pushed_by: { type: string, description: Machine id. }
            promoted_at: { type: string, format: date-time }
            replaces: { type: string }
            replaced_by: { type: string }
            in_use:
              type: boolean
              description: A runner uses the image now (a machine of `machines` has `in_use_by_runner`).
            shared_bytes:
              type: integer
              format: int64
              description: Bytes of the layers other images hold too (`size_bytes` minus `unique_bytes`).
            variant_gone_days:
              type: integer
              description: Variants only. Days after its branch is merged or deleted that the image is deleted.
            lineage:
              type: array
              description: The images of the same repository, profile and arch, newest first.
              items: { $ref: '#/components/schemas/RegistryLineageEntry' }
            layers:
              type: array
              items: { $ref: '#/components/schemas/RegistryLayer' }
            pulls_by_day:
              type: array
              description: 14 days, oldest first; every day present (0 when none).
              items: { $ref: '#/components/schemas/RegistryPullDay' }
            pulls_text:
              type: string
              description: The text form of the chart (UX-41). Always sent.
            saved_seconds: { type: number }
            machines:
              type: array
              items: { $ref: '#/components/schemas/RegistryImageMachine' }
            pointers:
              type: array
              items: { $ref: '#/components/schemas/RegistryPointer' }
            scan:
              $ref: '#/components/schemas/RegistryScan'
            similar:
              type: array
              description: Images of the same profile and arch sharing over 60% of bytes. Information only; never offered for replace.
              items:
                type: object
                required: [image_id, shared_percent]
                properties:
                  image_id: { type: string }
                  shared_percent: { type: number }
    RegistryLineageEntry:
      type: object
      required: [image_id, key, state, pushed_at]
      properties:
        image_id: { type: string }
        key: { type: string }
        state:
          $ref: '#/components/schemas/RegistryImageState'
        branch: { type: string }
        pushed_at: { type: string, format: date-time }
        relation:
          type: string
          description: How the entry relates to the image asked for.
          enum: [replaces, replaced_by, same_profile]
    RegistryLayer:
      type: object
      required: [digest, size_bytes, shared_with]
      properties:
        digest: { type: string }
        size_bytes: { type: integer, format: int64 }
        media_type: { type: string }
        shared_with:
          type: integer
          description: How many other images hold this layer.
    RegistryPullDay:
      type: object
      required: [day, pulls]
      properties:
        day: { type: string, format: date }
        pulls: { type: integer }
    RegistryImageMachine:
      type: object
      required: [machine_id, machine_name, holds]
      properties:
        machine_id: { type: string }
        machine_name: { type: string }
        holds:
          type: boolean
          description: The machine's engine has the image now (agent inventory).
        last_used_at: { type: string, format: date-time }
        in_use_by_runner:
          type: boolean
    RegistryPointer:
      type: object
      required: [repository, profile, arch, image_id, moved_at, moved_by]
      properties:
        repository: { type: string }
        profile: { type: string }
        arch:
          $ref: '#/components/schemas/RegistryArch'
        image_id: { type: string }
        previous_image_id: { type: string }
        moved_at: { type: string, format: date-time }
        moved_by: { type: string }
    RegistryScan:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/RegistryScanState'
        packages: { type: integer }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        scanned_at: { type: string, format: date-time }
        error: { type: string }
    RegistryStackFileChange:
      type: object
      required: [path, change]
      properties:
        path: { type: string }
        change:
          type: string
          enum: [added, removed, changed]
        before_sha256: { type: string }
        after_sha256: { type: string }
    RegistryCompare:
      type: object
      required:
        [
          new,
          old,
          stack_files,
          base_changed,
          shared_bytes,
          frees_bytes,
          repositories,
          keep_days_default,
        ]
      properties:
        new:
          $ref: '#/components/schemas/RegistryImageSummary'
        old:
          $ref: '#/components/schemas/RegistryImageSummary'
        stack_files:
          type: array
          items: { $ref: '#/components/schemas/RegistryStackFileChange' }
        base_changed: { type: boolean }
        shared_bytes: { type: integer, format: int64 }
        frees_bytes: { type: integer, format: int64 }
        repositories:
          type: array
          description: Repositories whose pointer would move.
          items: { type: string }
        keep_days_default: { type: integer }
    RegistryStoreSettings:
      type: object
      required:
        [
          folder,
          unused_days,
          keep_old_days,
          variant_gone_days,
          variant_unused_days,
          cleanup_weekday,
          cleanup_hour,
          alone_rules,
        ]
      properties:
        folder: { type: string }
        folder_pending:
          type: string
          description: A new folder waiting for the blobs to move.
        unused_days: { type: integer, minimum: 1, maximum: 3650 }
        keep_old_days: { type: integer, minimum: 0, maximum: 365 }
        variant_gone_days: { type: integer, minimum: 0, maximum: 365 }
        variant_unused_days: { type: integer, minimum: 1, maximum: 365 }
        cleanup_weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday.
        cleanup_hour: { type: integer, minimum: 0, maximum: 23 }
        alone_rules:
          type: array
          readOnly: true
          description: The rules crsp acts on without a yes (fixed by the owner).
          items: { $ref: '#/components/schemas/RegistryRule' }
    RegistryStoreSettingsInput:
      type: object
      required:
        [
          folder,
          unused_days,
          keep_old_days,
          variant_gone_days,
          variant_unused_days,
          cleanup_weekday,
          cleanup_hour,
        ]
      properties:
        folder: { type: string }
        unused_days: { type: integer, minimum: 1, maximum: 3650 }
        keep_old_days: { type: integer, minimum: 0, maximum: 365 }
        variant_gone_days: { type: integer, minimum: 0, maximum: 365 }
        variant_unused_days: { type: integer, minimum: 1, maximum: 365 }
        cleanup_weekday: { type: integer, minimum: 0, maximum: 6 }
        cleanup_hour: { type: integer, minimum: 0, maximum: 23 }
    RegistryCleanup:
      type: object
      required: [id, trigger, state, freed_bytes, started_at]
      properties:
        id: { type: integer, format: int64 }
        trigger:
          type: string
          enum: [weekly, now]
        state:
          type: string
          enum: [running, done, failed]
        freed_bytes: { type: integer, format: int64 }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    RegistryReplacePlanState:
      type: string
      enum: [draft, running, stopped, failed, done, rolled_back]
    RegistryReplacePlanInput:
      type: object
      required: [new_image_id]
      properties:
        new_image_id: { type: string }
        keep_days:
          type: integer
          minimum: 0
          maximum: 365
          description: When absent, the days of the registry settings (`keep_old_days`) are used.
    RegistryReplacePlan:
      type: object
      required:
        [
          id,
          state,
          new_image,
          old_image,
          keep_days,
          repositories,
          machines,
          steps_done,
          steps_total,
          created_at,
        ]
      properties:
        id: { type: string }
        state:
          $ref: '#/components/schemas/RegistryReplacePlanState'
        new_image:
          $ref: '#/components/schemas/RegistryImageSummary'
        old_image:
          $ref: '#/components/schemas/RegistryImageSummary'
        keep_days: { type: integer }
        keep_until:
          type: string
          format: date-time
          description: Until when the old image is kept. Before the plan ends it is the date it would be if the plan ended now.
        repositories:
          type: array
          items: { type: string }
        steps:
          type: array
          description: What the plan does, in order, with the state of each. The server owns the list and the states.
          items: { $ref: '#/components/schemas/RegistryReplaceStep' }
        machines:
          type: array
          description: Machines that held the old image and are warmed with the new one.
          items: { type: string }
        frees_bytes: { type: integer, format: int64 }
        steps_done: { type: integer }
        steps_total: { type: integer }
        step_text:
          type: string
          description: What runs now, in plain words.
        error: { type: string }
        can_rollback: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    RegistryReplaceStep:
      type: object
      required: [kind, targets, state]
      properties:
        kind:
          type: string
          description: point moves the pointer of one repository; warm asks the machines to pull the new image; supersede marks the old image superseded.
          enum: [point, warm, supersede]
        targets:
          type: array
          description: The repository of a point step, the machine names of the warm step, empty for supersede.
          items: { type: string }
        state:
          type: string
          enum: [waiting, running, done, failed]
    RegistryMirrorSettings:
      type: object
      required:
        [enabled, upstreams, folder, budget_bytes, tag_recheck_minutes, used_bytes]
      properties:
        enabled: { type: boolean }
        upstreams:
          type: array
          items: { type: string }
        folder: { type: string }
        budget_bytes: { type: integer, format: int64 }
        tag_recheck_minutes: { type: integer, minimum: 1, maximum: 10080 }
        used_bytes: { type: integer, format: int64 }
        path:
          type: string
          description: Where engines reach the mirror on the controller's listener.
    RegistryMirrorSettingsInput:
      type: object
      required: [enabled, upstreams, budget_bytes, tag_recheck_minutes]
      properties:
        enabled: { type: boolean }
        upstreams:
          type: array
          items: { type: string }
        folder: { type: string }
        budget_bytes: { type: integer, format: int64, minimum: 0 }
        tag_recheck_minutes: { type: integer, minimum: 1, maximum: 10080 }
    ImageBuildState:
      type: string
      enum: [queued, building, done, failed, cancelled]
    ImagePushState:
      type: string
      enum: [none, pushing, waiting_controller, pushed, promoted, refused, failed]
    ImageBuild:
      type: object
      required: [id, machine_id, key, state, push_state, step, steps_total, queued_at]
      properties:
        id: { type: string }
        machine_id: { type: string }
        machine_name: { type: string }
        profile: { type: string }
        arch:
          $ref: '#/components/schemas/RegistryArch'
        key: { type: string }
        reason:
          type: string
          enum:
            [
              first_runner,
              layers_changed,
              pin_updated,
              base_updated,
              asked,
              stack_changed,
              not_in_registry,
            ]
        state:
          $ref: '#/components/schemas/ImageBuildState'
        push_state:
          $ref: '#/components/schemas/ImagePushState'
        step: { type: integer }
        steps_total: { type: integer }
        step_name: { type: string }
        typical_seconds:
          type: number
          description: From earlier builds; absent with no history (the bar is the unknown-total bar, UX-29).
        seconds_left: { type: number }
        size_bytes: { type: integer, format: int64 }
        failure:
          type: object
          required: [step, class, why]
          properties:
            step: { type: string }
            class:
              type: string
              enum: [network, checksum, disk, apt, timeout, other]
            why: { type: string }
        log_tail:
          type: string
          description: Redacted, capped. Only on getImageBuild.
        queued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ImageBuildList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ImageBuild' }
    RegistryPull:
      type: object
      required: [id, machine_id, key, source, state, bytes_done, bytes_total, started_at]
      properties:
        id: { type: string }
        machine_id: { type: string }
        machine_name: { type: string }
        key: { type: string }
        image_id: { type: string }
        source:
          type: string
          enum: [local, pulled, built]
        state:
          type: string
          enum: [pulling, waiting_controller, done, failed]
        bytes_done: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        seconds_left:
          type: number
          description: From the machine's measured pull speed; absent with no history.
        repository: { type: string }
        error: { type: string }
        started_at: { type: string, format: date-time }
    RegistryPullList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegistryPull' }
    InsightArea:
      type: string
      description: ci-run-insights section 7. The screen area a finding belongs to.
      enum: [waits, pool, runs, workflows, guardrails, tests]
    Guardrail:
      type: string
      description: The dev-standards test guardrails G1 to G7.
      enum: [G1, G2, G3, G4, G5, G6, G7]
    InsightActionKind:
      type: string
      description: ci-run-insights R5.10. A setup change crsp can make after Review; absent when the fix is outside crsp.
      enum: [machine_slots, repo_parallel_limit, light_lane]
    InsightFinding:
      type: object
      description: ci-run-insights R5.7. Text fields are plain words, shown as text, never as markup.
      required:
        [
          id,
          kind,
          scope,
          area,
          title,
          fix,
          minutes_saved_week,
          first_seen,
          last_seen,
          evidence,
        ]
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          description: The finding kind of ci-run-insights section 7, such as wait.hold or workflow.timeout.
        scope:
          type: string
          enum: [repo, pool]
        repository_id: { type: integer, format: int64 }
        repository: { type: string }
        subject:
          type: string
          description: What it is about inside its kind (a job key, a label set, a workflow file, a test).
        area:
          $ref: '#/components/schemas/InsightArea'
        title: { type: string }
        fix: { type: string }
        snippet:
          type: string
          description: A workflow snippet for the fix, shown in a copyable block.
        evidence:
          type: object
          additionalProperties: true
          description: The numbers the finding page shows; its keys depend on the kind.
        minutes_saved_week:
          type: integer
          description: An estimate (R5.9).
        guardrail:
          $ref: '#/components/schemas/Guardrail'
        action_kind:
          $ref: '#/components/schemas/InsightActionKind'
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        dismissed_until:
          type: string
          format: date-time
          description: Set while the finding is hidden (owner decision D17); it shows again at this time if it is still true.
    InsightFindingList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InsightFinding' }
        total: { type: integer }
        next_cursor: { type: string }
        not_read_yet:
          $ref: '#/components/schemas/InsightBacklog'
    InsightBacklog:
      type: object
      description: ci-run-insights R6.1. Work waiting for the GitHub hourly limit.
      required: [jobs]
      properties:
        jobs: { type: integer }
        until: { type: string, format: date-time }
    InsightSummary:
      type: object
      required: [open, minutes_saved_week]
      properties:
        open: { type: integer }
        minutes_saved_week: { type: integer }
        enough_data:
          type: boolean
          description: False under 50 finished jobs in the window.
    InsightPlanChange:
      type: object
      required: [target, field, from, to, words]
      properties:
        target:
          type: string
          description: The machine id or repository it changes.
        target_name: { type: string }
        field:
          type: string
          description: The setting, such as job_slots, light_slots or max_parallel_jobs.
        from: { type: integer }
        to: { type: integer }
        words: { type: string }
        jobs_waited_for:
          type: array
          description: Running jobs the change waits for (UX-62).
          items: { type: string }
    InsightPlanResult:
      type: object
      required: [target, field, state]
      properties:
        target: { type: string }
        field: { type: string }
        state:
          type: string
          enum: [pending, done, failed, skipped]
        error: { type: string }
    InsightPlan:
      type: object
      required: [id, finding_id, action_kind, state, changes, results, created_at]
      properties:
        id: { type: string }
        finding_id: { type: integer, format: int64 }
        action_kind:
          $ref: '#/components/schemas/InsightActionKind'
        state:
          type: string
          enum: [draft, running, done, failed, stopped]
        changes:
          type: array
          items: { $ref: '#/components/schemas/InsightPlanChange' }
        results:
          type: array
          items: { $ref: '#/components/schemas/InsightPlanResult' }
        estimate:
          type: string
          description: The estimate in words, such as "p95 wait from about 9 to about 3 min".
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    WaitSplitRow:
      type: object
      required: [key, jobs, wait, hold, run]
      properties:
        key:
          type: string
          description: The repository, the job key or the day (year-month-day, UTC).
        jobs: { type: integer }
        wait: { $ref: '#/components/schemas/DurationStats' }
        hold: { $ref: '#/components/schemas/DurationStats' }
        run: { $ref: '#/components/schemas/DurationStats' }
        holds_over_cap: { type: integer }
        hold_reasons:
          type: object
          description: Holds over the cap by reason (image_pull, runner_start, registration, load, unknown).
          additionalProperties: { type: integer }
    DurationStats:
      type: object
      required: [total_seconds]
      properties:
        total_seconds: { type: integer, format: int64 }
        p50_seconds: { type: integer }
        p95_seconds: { type: integer }
        known:
          type: integer
          description: Jobs with a known value; unknown is never counted as 0.
    WaitSplit:
      type: object
      required: [days, group, rows, hold_cap_seconds]
      properties:
        days: { type: integer }
        group:
          type: string
          enum: [repository, job_key, day]
        hold_cap_seconds: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/WaitSplitRow' }
    TimelineSegment:
      type: object
      required: [kind, start, end]
      properties:
        kind:
          type: string
          enum: [job, idle, wait]
          description: A wait is the time a follow-up job waited for its runner (CIX24).
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        job_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        follow_up:
          type: boolean
          description: The job belongs to a run another run started (event workflow_run).
        repository: { type: string }
        job_ident: { type: string }
        event: { type: string }
        markers:
          type: array
          items:
            type: string
            enum: [idle_while_waiting, after_merge_work]
        waiting_job_ids:
          type: array
          description: For a marked segment, the jobs that waited meanwhile.
          items: { type: integer, format: int64 }
    TimelineLane:
      type: object
      required: [runner_name, origin, segments]
      properties:
        runner_name: { type: string }
        origin:
          type: string
          enum: [crsp, other, hosted]
        machine_name: { type: string }
        labels:
          type: array
          items: { type: string }
        segments:
          type: array
          items: { $ref: '#/components/schemas/TimelineSegment' }
    PoolTimeline:
      type: object
      required: [from, to, lanes]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        lanes:
          type: array
          items: { $ref: '#/components/schemas/TimelineLane' }
    SlotEstimate:
      type: object
      required: [extra_slots]
      properties:
        extra_slots: { type: integer }
        mean_wait_seconds:
          type: number
          description: Absent when the queue would still grow.
        p95_wait_seconds: { type: number }
        utilisation: { type: number }
    LabelSetDemand:
      type: object
      required: [labels, slots, utilisation, jobs_per_hour, estimates]
      properties:
        labels:
          type: array
          items: { type: string }
        slots: { type: integer }
        utilisation:
          type: number
          description: Busy slot minutes over available slot minutes, 0 to 1 (can exceed 1 when the queue grows).
        jobs_per_hour: { type: number }
        mean_service_seconds: { type: number }
        cv_arrivals: { type: number }
        cv_service: { type: number }
        p50_wait_seconds: { type: number }
        p95_wait_seconds: { type: number }
        min_slots_needed:
          type: integer
          description: Set when the queue grows; the smallest slot count with utilisation under 0.85.
        estimates:
          type: array
          items: { $ref: '#/components/schemas/SlotEstimate' }
        p95_wait_by_day:
          type: array
          items: { $ref: '#/components/schemas/DayValue' }
    DayValue:
      type: object
      required: [day, value]
      properties:
        day: { type: string, format: date }
        value: { type: number }
    PoolSizing:
      type: object
      required: [days, label_sets, method]
      properties:
        days: { type: integer }
        method:
          type: string
          description: The estimate's method in words (Allen-Cunneen with Sakasegawa).
        label_sets:
          type: array
          items: { $ref: '#/components/schemas/LabelSetDemand' }
    TestInsight:
      type: object
      required: [test_id, name, repository, runs]
      properties:
        test_id: { type: string }
        name: { type: string }
        suite: { type: string }
        file: { type: string }
        repository: { type: string }
        job_idents:
          type: array
          items: { type: string }
        kind:
          type: string
          enum: [unit, integration, e2e]
        runs: { type: integer }
        failures: { type: integer }
        p50_ms: { type: integer }
        p95_ms: { type: integer }
        over_limit_seconds:
          type: integer
          description: Set when the p95 is over the G1 limit of its kind.
        flaky_runs: { type: integer }
        assertions:
          type: integer
          description: -1 when the format does not report them.
        last_seen: { type: string, format: date-time }
    TestInsightList:
      type: object
      required: [items, total, reports_found]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestInsight' }
        total: { type: integer }
        next_cursor: { type: string }
        reports_found:
          type: boolean
          description: False when no test report was found in the window.
    GuardrailState:
      type: object
      required: [guardrail, state, source]
      properties:
        guardrail: { $ref: '#/components/schemas/Guardrail' }
        state:
          type: string
          enum: [pass, break, off, unknown]
        count: { type: integer }
        reason: { type: string }
        source:
          type: string
          enum: [guard_report, crsp]
        reported_at: { type: string, format: date-time }
    GuardrailStatus:
      type: object
      required: [repository_id, repository, guardrails]
      properties:
        repository_id: { type: integer, format: int64 }
        repository: { type: string }
        guardrails:
          type: array
          items: { $ref: '#/components/schemas/GuardrailState' }
        known_count_by_day:
          type: array
          description: The guard's known-list count per day, 30 days.
          items: { $ref: '#/components/schemas/DayValue' }
    GuardrailStatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GuardrailStatus' }
    InsightDigest:
      type: object
      required: [week, written_at, text]
      properties:
        week: { type: string, example: 2026-W47 }
        written_at: { type: string, format: date-time }
        text:
          type: string
          description: The digest file's Markdown, shown as text.
    InsightDigestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InsightDigest' }
    RunSaving:
      type: object
      required: [minutes, words, job]
      properties:
        minutes: { type: number }
        words:
          type: string
          description: '"The run would end {n} min sooner if {change}."'
        job: { type: string }
        change:
          type: string
          enum: [no_wait, median_run, start_after_needs]
    RunWaste:
      type: object
      required: [kind, minutes, words]
      properties:
        kind:
          type: string
          enum: [superseded, duplicate_event, retested_tree, fail_fast]
        minutes: { type: number }
        words: { type: string }
    RunSavings:
      type: object
      required: [savings, waste]
      properties:
        savings:
          type: array
          items: { $ref: '#/components/schemas/RunSaving' }
        waste:
          type: array
          items: { $ref: '#/components/schemas/RunWaste' }
        reason:
          type: string
          description: Why nothing is computed (the run is not finished, no needs graph).
    WorkflowCheck:
      type: object
      required: [workflow, check_id, status]
      properties:
        workflow: { type: string }
        check_id:
          type: string
          enum:
            [
              workflow.timeout,
              workflow.retry,
              workflow.matrix_axis,
              workflow.step_order,
              workflow.cache,
              workflow.slow_tests_on_pr,
            ]
        job: { type: string }
        status:
          type: string
          enum: [ok, fail, skip]
        line: { type: integer }
        detail: { type: string }
        guardrail: { $ref: '#/components/schemas/Guardrail' }
    WorkflowCheckList:
      type: object
      required: [items]
      properties:
        head_sha: { type: string }
        checked_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkflowCheck' }
    ResourceSample:
      type: object
      required: [at, cpu_cores, memory_bytes]
      properties:
        at: { type: string, format: date-time }
        cpu_cores: { type: number }
        memory_bytes: { type: integer, format: int64 }
        known: { type: boolean }
    JobResources:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          items: { $ref: '#/components/schemas/ResourceSample' }
        cpu_p95_cores: { type: number }
        cpu_peak_cores: { type: number }
        memory_p95_bytes: { type: integer, format: int64 }
        memory_peak_bytes: { type: integer, format: int64 }
        unknown_reason: { type: string }
