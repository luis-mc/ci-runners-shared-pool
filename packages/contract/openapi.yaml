openapi: 3.1.0
info:
  title: CI Runners Shared Pool API
  version: 0.1.0
  description: >-
    Controller API, milestone 1 contract (CRSP17). Every operation declares
    `x-auth` (public, user, admin or owner) and `x-rate-limit` (STACKSPEC 11.1);
    the route-coverage test in internal/api fails otherwise. `user` means any
    signed-in user (the viewer role and up). A request that changes something
    carries the session's CSRF token in `X-CSRF-Token` and must come from the
    console's own origin (web-console R6.2). A CLI token in
    `Authorization: Bearer` is accepted wherever a session is (github-integration
    R5.15). Every error uses the ErrorEnvelope. Stable error codes: bad_request,
    unauthenticated, session_expired, forbidden, not_found, conflict,
    rate_limited, needs_confirmation, github_unavailable, not_implemented,
    internal, unavailable.
servers:
  - url: /
tags:
  - name: health
  - name: setup
    description: First run (github-integration R5.1 to R5.6)
  - name: auth
    description: Sign-in, sessions, CLI tokens, tray links (github-integration R5.8 to R5.16, tray R5.6 to R5.10)
  - name: users
    description: Users, roles and preferences (github-integration R5.10 to R5.12, web-console 4.9)
  - name: repositories
    description: Installations, repositories, policies, variables (github-integration R5.17 to R5.30)
  - name: machines
    description: Machines, join codes, settings, drain (machines R5.1 to R5.52)
  - name: runners
    description: Runners and plans (runners R5.1 to R5.7)
  - name: jobs
    description: Queue, slots and history (scheduling, observability R5.7 to R5.12)
  - name: live
    description: Overview and the event stream (observability R5.1 to R5.6)
  - name: doctor
    description: Doctor runs and findings (doctor 7.1)
  - name: settings
    description: Controller settings and the audit log (observability R5.24 to R5.32)
  - name: backups
    description: Backup, restore and drill (operations R5.21 to R5.27)
  - name: images
    description: Images and tool layers (runners R5.32 to R5.35, web-console R5.25)
  - name: caches
    description: Caches per machine (caches R5.8 to R5.14, web-console R5.25)
  - name: registry
    description: The pool's private image registry, its budgets, replace and mirror (registry R5.1 to R5.80)
  - name: notifications
    description: Notification channels (notifications R5.7 to R5.9)
  - name: update
    description: Self-update and service restart with drain (operations R5.11 to R5.18, tray R5.15 to R5.18)
  - name: webhooks
    description: GitHub webhook intake (github-integration R5.36)
paths:
  /healthz:
    get:
      operationId: getHealth
      x-cli: none
      x-cli-reason: 'A probe for load balancers and the tray, not an action of a person.'
      tags: [health]
      summary: Liveness and database check
      x-auth: public
      x-rate-limit: 60/minute/ip
      responses:
        '200':
          description: The controller is up and its database answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The controller is up but a dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ---------------------------------------------------------------- setup
  /api/v1/setup:
    get:
      operationId: getSetupState
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: First-run state; what the setup page shows
      description: github-integration R5.1, web-console R5.14 and R5.15.
      x-auth: public
      x-rate-limit: 60/minute/ip
      responses:
        '200':
          description: The first-run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/setup/redeem:
    post:
      operationId: redeemSetupLink
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: Trade a one-time setup code for a setup cookie
      description: >-
        github-integration R5.1, web-console R5.14. The code works once and
        expires. The answer sets an HttpOnly setup cookie.
      x-auth: public
      x-rate-limit: 10/minute/ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemSetupLinkRequest'
      responses:
        '200':
          description: The code was good; the setup cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/setup/github-app:
    post:
      operationId: startAppManifest
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: Start GitHub's App manifest flow
      description: >-
        github-integration R5.2 and R5.4. Needs the setup cookie. Returns the
        manifest and the GitHub URL the browser posts it to.
      x-auth: public
      x-rate-limit: 10/minute/ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAppManifestRequest'
      responses:
        '200':
          description: The manifest form to post to GitHub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppManifestForm'
        default:
          $ref: '#/components/responses/Error'
  /auth/github/app-created:
    get:
      operationId: completeAppManifest
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [setup]
      summary: GitHub's redirect after the App is created
      description: >-
        github-integration R5.3. Trades the code once through
        `POST /app-manifests/{code}/conversions`; secrets go to the OS secret
        store, never the database. Redirects to the setup page.
      x-auth: public
      x-rate-limit: 10/minute/ip
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'

  # ---------------------------------------------------------------- auth
  /auth/github/login:
    get:
      operationId: startSignIn
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: Start web sign-in with the App's user OAuth flow
      description: >-
        github-integration R5.8. Sets a random state and a PKCE verifier and
        redirects to GitHub. `return_to` must be a same-origin path
        (web-console R5.9). `bind_tray` binds this GitHub user to the calling
        OS user of the tray (owner decision for M1, tray R5.6).
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            example: /machines
        - name: bind_tray
          in: query
          required: false
          description: A one-time tray binding code from the local channel.
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /auth/github/callback:
    get:
      operationId: completeSignIn
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: GitHub OAuth callback; makes the session
      description: >-
        github-integration R5.8 to R5.10 and R5.13. Checks state and PKCE,
        resolves the GitHub user id, makes the session cookie and redirects to
        the kept path. A user not on the list gets the no-access page.
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /auth/github/handoff:
    get:
      operationId: redeemSignInHandoff
      x-cli: none
      x-cli-reason: 'Browser entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: Finish a sign-in on the address it started on
      description: >-
        github-integration R5.8 (OPS16). A sign-in that started on an address
        GitHub has no callback URL for goes through the registered loopback
        address and comes back here, on the address it started on, with a
        one-time code. The code is single use, valid 60 seconds, bound to the
        sign-in state, to this address and to the browser that started the
        sign-in. Sets the session cookie and redirects to the kept path.
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /auth/link:
    get:
      operationId: redeemTrayLink
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [auth]
      summary: Sign in from a one-time tray link
      description: >-
        tray R5.7 and R6.1. The code is 128 random bits, valid 60 seconds,
        usable once, stored only as a hash. Marks it used in the transaction
        that makes the session, then redirects to a URL without the code.
      x-auth: public
      x-rate-limit: 20/minute/ip
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli/config:
    get:
      operationId: getCliLoginConfig
      tags: [auth]
      summary: What the CLI needs to start GitHub's device flow
      description: github-integration R5.14. The App's client id is public.
      x-auth: public
      x-rate-limit: 60/minute/ip
      responses:
        '200':
          description: Device flow settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliLoginConfig'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli:
    post:
      operationId: exchangeCliToken
      tags: [auth]
      summary: Trade a device-flow GitHub user token for a CLI token
      description: >-
        github-integration R5.14 and R5.15. The controller checks the GitHub
        token, drops it, and returns its own CLI token once. The token expires
        after 30 days.
      x-auth: public
      x-rate-limit: 10/minute/ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCliTokenRequest'
      responses:
        '201':
          description: The CLI token. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliTokenCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli/tokens:
    get:
      operationId: listCliTokens
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [auth]
      summary: List CLI tokens (own; every user's for the owner)
      description: github-integration R5.15.
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The tokens, without their values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliTokenList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/cli/tokens/{tokenId}:
    delete:
      operationId: revokeCliToken
      tags: [auth]
      summary: Revoke a CLI token
      description: github-integration R5.15. The owner or the token's user.
      x-auth: user
      x-rate-limit: 60/minute/user
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/access-credentials:
    get:
      operationId: listAccessCredentials
      x-cli: none
      x-cli-reason: 'Made, listed and revoked in the web console only (owner rule: everything from the web console).'
      tags: [auth]
      summary: List access credentials for CI
      description: github-integration R5.82. Without their values.
      x-auth: admin
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCredentialList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAccessCredential
      x-cli: none
      x-cli-reason: 'Made, listed and revoked in the web console only (owner rule: everything from the web console).'
      tags: [auth]
      summary: Make an access credential for CI
      description: >-
        github-integration R5.82. The value is in the answer once; only its
        hash is kept and the audit row never holds it. A credential has one
        scope; `parity` allows only what `crsp parity check` calls.
      x-auth: admin
      x-rate-limit: 30/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCredentialCreate'
      responses:
        '201':
          description: The credential and its value. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCredentialCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/access-credentials/{credentialId}:
    delete:
      operationId: revokeAccessCredential
      x-cli: none
      x-cli-reason: 'Made, listed and revoked in the web console only (owner rule: everything from the web console).'
      tags: [auth]
      summary: Revoke an access credential
      description: github-integration R5.82. The next request with its value is refused.
      x-auth: admin
      x-rate-limit: 60/minute/user
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/parity-address:
    get:
      operationId: getParityAddress
      x-cli: none
      x-cli-reason: 'A console check: it shows what the parity setup will write (owner rule: everything from the web console).'
      tags: [repositories]
      summary: The address the parity setup will write, and whether it answers
      description: >-
        github-integration R5.84 (CRSP141). The address a runner uses to reach
        the controller: https, the public host and the console port, the same
        address machines join at. The controller calls it from the server side
        with its own CA and says whether it answers. A controller with no such
        address answers `needs_address` with the setting to fix.
      x-auth: admin
      x-rate-limit: 10/minute/user
      responses:
        '200':
          description: The address and the result of calling it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityAddress'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/repositories/{repositoryId}/parity-setup:
    post:
      operationId: setupRepositoryParity
      x-cli: none
      x-cli-reason: 'A console action: it writes to GitHub through the App (owner rule: everything from the web console).'
      tags: [repositories]
      summary: Set up parity for this repository
      description: >-
        github-integration R5.84. Makes a `parity` access credential and writes
        it as the repository Actions secret CRSP_ACCESS, and the controller
        address and CA fingerprint as the variables CRSP_URL and
        CRSP_CA_FINGERPRINT, through the GitHub App. The address is the one
        machines use to join (https, the controller CA), never the address of
        the browser, never loopback or http (CRSP141); when the controller has
        none the answer is `needs_address` and nothing is made. When the App lacks the
        `secrets` or `actions_variables` write permission nothing is made: the
        answer is `needs_permission` with the GitHub pages that grant it.
      x-auth: admin
      x-rate-limit: 10/minute/user
      parameters:
        - $ref: '#/components/parameters/RepositoryId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParitySetupRequest'
      responses:
        '200':
          description: Done, or the permission the App lacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParitySetup'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: signOut
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [auth]
      summary: End this session
      description: web-console R5.12. Sessions end only at sign-out (owner decision for M1).
      x-auth: user
      x-rate-limit: 60/minute/user
      responses:
        '204':
          description: The session ended; the cookie is cleared.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/console-links:
    post:
      operationId: createConsoleLink
      tags: [auth]
      summary: Make a one-time link that signs the caller in to the web console
      description: >-
        cli R5.9 (added by CRSP25). The link carries a code of 128 random bits,
        valid 60 seconds, usable once, redeemed by redeemTrayLink. The caller
        must be signed in; the link gives the same user and role.
      x-auth: user
      x-rate-limit: 20/minute/user
      responses:
        '201':
          description: The link. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleLink'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getSession
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [auth]
      summary: The signed-in user, role and CSRF token
      description: web-console 4.1, github-integration R5.9 and R5.12.
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'

  # ---------------------------------------------------------------- users
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: The user's own view preferences
      description: web-console 4.9 Appearance (UX-60).
      x-auth: user
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePreferences
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Save the user's own view preferences
      x-auth: user
      x-rate-limit: 60/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/app/private-key:
    put:
      operationId: replaceAppPrivateKey
      tags: [auth]
      summary: Replace the GitHub App private key
      description: >-
        github-integration R5.7. The owner sends a new private key once. The
        controller signs an App JWT with it and reads `GET /app`; only when
        GitHub accepts it for the same App does the key replace the old one in
        the OS secret store. A refused key leaves the old one in place. The key
        is never returned, logged or written to the audit log.
      x-auth: owner
      x-rate-limit: 5/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppKeyUpload'
      responses:
        '204':
          description: The new key is stored and in use.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/app/webhook:
    get:
      operationId: getAppWebhook
      x-cli: none
      x-cli-reason: 'The webhook address is set in the console, Settings, Access, Webhooks, where the guided GitHub step is.'
      tags: [auth]
      summary: Read the GitHub App webhook state
      description: >-
        github-integration R5.51 (OPS25). Says whether real webhooks are off, on or
        failing, the public address, and the newest delivery of any repository.
        The secret is never returned.
      x-auth: admin
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The webhook state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppWebhook'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setAppWebhook
      x-cli: none
      x-cli-reason: 'The webhook address is set in the console, Settings, Access, Webhooks, where the guided GitHub step is.'
      tags: [auth]
      summary: Turn real GitHub webhooks on
      description: >-
        github-integration R5.51 (OPS25). The owner gives the public https address that
        forwards to the controller. The controller makes a webhook secret and keeps
        it in the OS secret store, sends a signed test ping to `<address>/webhooks/github`,
        and only when that works sets the App's webhook at GitHub
        (`PATCH /app/hook/config`). A failed test or a refusal of GitHub keeps the old
        state. When the App does not subscribe to `workflow_job`, the answer carries
        `events_link`, the App's page where the owner ticks it.
      x-auth: owner
      x-rate-limit: 5/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppWebhookUpdate'
      responses:
        '200':
          description: Webhooks are on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppWebhook'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearAppWebhook
      x-cli: none
      x-cli-reason: 'The webhook address is set in the console, Settings, Access, Webhooks, where the guided GitHub step is.'
      tags: [auth]
      summary: Turn real GitHub webhooks off
      description: >-
        github-integration R5.51 (OPS25). Clears the App's webhook config at GitHub,
        removes the webhook secret and returns to polling.
      x-auth: owner
      x-rate-limit: 5/minute/user
      responses:
        '200':
          description: Webhooks are off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppWebhook'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      operationId: listUsers
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Users allowed to sign in, with their roles
      description: github-integration R5.11, web-console R5.28.
      x-auth: owner
      x-rate-limit: 600/minute/user
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addUser
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Allow a GitHub login as admin or viewer
      description: github-integration R5.11. The login is resolved to a user id when added.
      x-auth: owner
      x-rate-limit: 60/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users/{userId}:
    patch:
      operationId: updateUserRole
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [users]
      summary: Change a user's role
      description: >-
        github-integration R5.10 and R5.12. There is always exactly one owner;
        handing over ownership names both users and needs `confirm`.
