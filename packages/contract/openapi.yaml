          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveRegistrationResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/machines/{machineId}/docker-compact:
    post:
      operationId: startDockerCompact
      x-cli: none
      x-cli-reason: 'The owner confirms the size on the machine screen first; the CLI has no command for it yet.'
      tags: [machines]
      summary: Make Docker's disk file smaller now
      description: >-
        caches R5.58. The owner starts the compact the policy would start later:
        the machine is drained (new jobs wait, running jobs finish), Docker's disk
        file is made smaller, and the machine takes jobs again. Without
        `confirm=true` it answers 409 needs_confirmation naming the size that can
        be reclaimed and what happens to jobs. With it the compact starts in the
        background and answers 202; the machine's `docker_compact_status` shows
        it running and then its result. Refused with 400 when the agent reports no
        disk file or has no administrator rights, 409 when the machine is offline
        or a compact or a change already holds it.
      x-auth: admin
      x-rate-limit: 10/minute/user
      parameters:
        - $ref: '#/components/parameters/MachineId'
        - $ref: '#/components/parameters/Confirm'
      responses:
        '202':
          description: The compact has started.
          content:
            application/json:
              schema:
                type: object
                required: [started]
                properties:
                  started:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /api/v1/machines/{machineId}/runner-leftovers/remove:
    post:
      operationId: removeRunnerLeftovers
      tags: [machines]
      summary: Remove runner leftovers no controller owns
      description: >-
        doctor R5.48 (OPS33). Removes the named items from the machine through
        its agent: the service by its exact name, the folder, the local account
        and the download. Only items the latest doctor scan of this machine
        listed and that this controller still does not own are removed; anything
        owned, or outside the crsp runners folders, is refused. The agent needs
        administrator rights. Each item has its own result; a partial failure
        answers 200 with the failed items in `results`.
      x-auth: admin
      x-rate-limit: 10/minute/user
      parameters:
        - $ref: '#/components/parameters/MachineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRunnerLeftoversRequest'
      responses:
        '200':
          description: One result per requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveRunnerLeftoversResult'
        default:
          $ref: '#/components/responses/Error'
