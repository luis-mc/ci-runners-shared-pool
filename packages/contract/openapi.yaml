          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        github_wait_seconds:
          type: integer
        slot_wait_seconds:
          type: integer
        run_seconds:
          type: integer
        result:
          $ref: '#/components/schemas/JobResult'
        html_url:
          type: string
        job_ident:
          type: string
          description: Repository, workflow, job name with matrix values. The same job of another run has the same key (OPS34).
        node_id:
          type: string
          description: The id of the job inside its run (its name with matrix values). Edges and `needs` use it.
        matrix:
          type: array
          items:
            type: string
        branch:
          type: string
        pull_request:
          type: integer
        task_id:
          type: string
          description: The task id the branch starts with, when it does.
        worktree:
          type: string
          description: Only when the job reported it.
        job_type:
          type: string
          enum: [light, standard, heavy]
          description: The scheduler class of the job. Not the job name; filter by name with the `job_type` query.
        needs:
          type: array
          items:
            type: string
          description: node_id of the jobs this one needs.
        runner:
          $ref: '#/components/schemas/RunnerRef'
        cleanup_seconds:
          type: integer
        queue_position:
          type: integer
          description: 1-based place in the queue, queued jobs only.
        queue_eta:
          $ref: '#/components/schemas/Eta'
        forecast:
          $ref: '#/components/schemas/Forecast'
        runner_origin:
          type: string
          enum: [crsp, other, hosted]
          description: ci-run-insights R5.39. Who ran the job; absent while not known.
        runner_group:
          type: string
          description: GitHub's runner group name of the runner that ran the job.
        runner_labels:
          type: array
          items:
            type: string
          description: The labels of the runner that ran the job, as GitHub reports them.
        steps_source:
          type: string
          enum: [events, rest]
          description: ci-run-insights R5.40. Where the steps came from.
        checked_at:
          type: string
          format: date-time
          description: ci-run-insights R5.41. When crsp last re-read the job from GitHub.
      example:
        id: 1
        repository: luis-mc/app
        repository_id: 700100
        run_id: 11223344
        run_attempt: 1
        github_job_id: 81234567
        workflow: ci.yml
        job_name: test
        labels: [self-hosted, linux, x64]
        state: queued
        wait_reason: free_slot
        wait_text: waits for a free slot on box-1 (2 of 2 taken)
