  /webhooks/github:
    post:
      operationId: receiveGithubWebhook
      x-cli: none
      x-cli-reason: 'Browser or GitHub entry point; the CLI signs in with the device flow instead.'
      tags: [webhooks]
      summary: GitHub webhook deliveries
      description: >-
        github-integration R5.36 and R6.5. Authorised by the
        `X-Hub-Signature-256` signature (constant-time compare), not a session;
        a bad signature gets 401 before the body is parsed. Bodies over 25 MB
        are refused. Deliveries are de-duplicated by `X-GitHub-Delivery`.
      x-auth: public
      x-rate-limit: 600/minute/ip
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Taken.
        default:
          $ref: '#/components/responses/Error'

