  /api/v1/join-codes/ssh:
    post:
      operationId: joinMachineOverSsh
      x-cli: none
      x-cli-reason: 'Later: remaining console screens get commands in their own task (cli open question 7).'
      tags: [machines]
      summary: Join a Linux, macOS or Windows machine over SSH
      description: >-
        machines R5.3a (RES3, owner decision D59; Windows with OpenSSH server, CRSP123, D70: the SSH user must be an administrator). The optional path beside
