      summary: Make a one-time join code and the install commands
      description: >-
        machines R5.3 to R5.6 (M1 by owner decision). The code shows once, in
        this answer only. A new code makes the old unused one invalid.
      x-auth: admin
      x-rate-limit: 10/minute/user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinCodeRequest'
      responses:
        '201':
          description: The code and the commands that carry it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCodeCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/join-files:
    post:
      operationId: createJoinFile
      tags: [machines]
      summary: Download an installer file with a one-time join code built in
      description: >-
        machines R5.65 (CRSP122, owner decision D70). Makes a join code (R5.4: it
        works once and lives 15 minutes by default; an older unused code becomes
        invalid) and answers a file for the machine's OS: a `.cmd` for Windows, a
        `.sh` for Linux, a `.command` for macOS. The file holds the controller
        address, the certificate fingerprint, the code and the SHA-256 of the
        release packages, and nothing else secret. The file name says the OS and
        the expiry. `X-Join-Code-Id` is the id to poll with getJoinCode. The audit
        entry never holds the code. 501 when this controller has no release
        packages to hand out (a development build).
      x-auth: admin
      x-rate-limit: 10/minute/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinFileRequest'
      responses:
        '201':
          description: The installer file.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
              example: attachment; filename="crsp-join-linux-until-20261114T1215Z.sh"
            X-Join-Code-Id:
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /api/v1/packages/{name}:
    get:
