      x-cli-reason: 'The owner confirms each half-registered runner in the Doctor screen; the CLI has no command for it yet.'
      tags: [doctor]
      summary: Remove one half of a half-registered runner
      description: >-
        doctor R5.50, runners R5.94. `remove_github_runner` deletes a GitHub
        runner with the pool's name prefix that no local record owns;
        `remove_runner_record` removes the local record (and its service, account
        and folder when the machine answers) of a runner GitHub does not list.
        The server reads GitHub and the records again and refuses when the state
        changed. Without `confirm=true` it answers 409 needs_confirmation naming
        what goes.
      x-auth: admin
      x-rate-limit: 30/minute/user
      parameters:
        - $ref: '#/components/parameters/Confirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRegistrationRequest'
      responses:
        '200':
