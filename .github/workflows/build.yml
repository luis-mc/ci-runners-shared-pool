name: Build

# Reusable workflow: builds the web console, embeds it, and builds the binary for
# the six release targets. CI and Release both call it.
#
# Linux and Windows targets cross-compile on ubuntu with CGO_ENABLED=0. The two
# macOS targets build on a macOS runner, because the tray mode (planned) needs
# CGO on macOS.
#
# Each target uploads one artifact named <prefix><os>-<arch>, with no version or
# run number in the name, so artifact-prune.yml can keep only the newest of each.
on:
  workflow_call:
    inputs:
      version:
        description: Version string stamped into the binary
        required: true
        type: string
      artifact-prefix:
        description: Prefix of the artifact names
        required: false
        default: crsp-
        type: string

permissions:
  contents: read

jobs:
  web:
    name: web console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: node scripts/ci/embed-web.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-embed
          path: internal/webui/dist
          if-no-files-found: error
          # CRSP312: read inside the same run only; a release keeps the default.
          retention-days: ${{ github.workflow == 'Release' && 90 || 2 }}

  binary:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, cgo: '0' }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest, cgo: '0' }
          - { goos: windows, goarch: amd64, runner: ubuntu-latest, cgo: '0' }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest, cgo: '0' }
          - { goos: darwin, goarch: amd64, runner: macos-latest, cgo: '1' }
          - { goos: darwin, goarch: arm64, runner: macos-latest, cgo: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-embed
          path: internal/webui/dist
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ inputs.version }}
        run: |
          exe=""
          if [ "$GOOS" = "windows" ]; then exe=".exe"; fi
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "out/crsp${exe}" ./cmd/crsp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix }}${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error
          # CRSP312: read inside the same run only; a release keeps the default.
          retention-days: ${{ github.workflow == 'Release' && 90 || 2 }}
