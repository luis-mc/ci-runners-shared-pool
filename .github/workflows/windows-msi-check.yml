name: Windows MSI (Linux check)

# CIR10 W1/W2. OPTIONAL. A CI CHECK ONLY: it proves the MSI authoring builds under Wine.
# The shipped MSI is built on Windows (package-windows.yml) and named Crsp-<version>-win-<arch>.msi (OPS69). Wine cannot write LZX, so this
# build uses `mszip`; the file is bigger and has never been installed.
# PRODUCT: delete this file if the product ships no MSI. Fill scripts/delivery/windows-build-tools.json.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'installer/**'
      - 'scripts/delivery/windows-build-tools.json'
      - '.github/workflows/windows-msi-check.yml'
  workflow_dispatch:

concurrency:
  group: msi-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msi:
    name: MSI builds under Wine (check only)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: msi
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CRSP17: wired for the future MSI task; a no-op until scripts/delivery/windows-build-tools.json exists.
      - name: Is the MSI wired yet
        id: gate
        run: if [ -f scripts/delivery/windows-build-tools.json ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      # DL191: a pool runner has no sudo but its image already has wine and xvfb-run (windows-packaging layer);
      # install them only when they are missing (hosted runners).
      - name: Install Wine and a virtual display
        if: steps.gate.outputs.present == 'true'
        run: |
          if command -v wine >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "wine and xvfb-run are already installed"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends wine xvfb
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.gate.outputs.present == 'true'
        with:
          path: ~/.cache/msi-build
          key: msi-build-${{ hashFiles('scripts/delivery/windows-build-tools.json') }}
      - name: Build the MSI (not the shipped file)
        if: steps.gate.outputs.present == 'true'
        run: bash scripts/delivery/windows-msi-linux.sh
      # CRSP147: one entry in the Windows programs list. The authoring has no second Uninstall key,
      # no hidden MSI entry, one UpgradeCode and a major upgrade (installer/wxs_test.go has the same rules).
      - name: One programs-list entry (authoring check)
        run: |
          python3 - <<'PY'
          import re, sys
          s = re.sub(r"(?s)<!--.*?-->", "", open("installer/crsp.wxs").read())
          bad = []
          if "CurrentVersion\\Uninstall" in s: bad.append("the package writes its own Uninstall key (a second entry)")
          if "ARPSYSTEMCOMPONENT" in s: bad.append("a hidden MSI entry is authored")
          if s.count('UpgradeCode="C1D62442-6DB4-4FF0-9F28-A1CE3121B332"') != 1: bad.append("the shipped UpgradeCode must appear once")
          if "<MajorUpgrade" not in s: bad.append("MajorUpgrade is missing")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("one programs-list entry: ok")
          PY
