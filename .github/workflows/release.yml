name: Release

# push to main  -> the `edge` pre-release is replaced with this commit's build.
#                  The owner installs edge on their own pool first (staging).
# tag v*        -> a stable release with the same assets (production).
#
# Assets, all named Crsp-<version>-<os>-<arch>.<ext> (OPS69): os is win, linux or macos; arch is x64
# or arm64; ext is msi, deb, rpm, pkg, tar.gz or zip. Examples: Crsp-0.1.22-win-x64.msi,
# Crsp-0.1.22-linux-x64.deb, Crsp-0.1.22-macos-arm64.pkg, Crsp-0.1.22-linux-x64.tar.gz.
# The Windows MSI is built with WiX v5 on windows-latest; deb and rpm are OPS1. The version has
# no leading v (an edge build carries edge-<sha>). The CI artifacts and the files the build
# scripts write keep their stable names (DL-22); the publish job renames the files when it fills
# dist/ (scripts/ci/release-names.sh).
# crsp-sbom-go.spdx.json and crsp-sbom-web.spdx.json (SPDX SBOMs, CRSP90),
# manifest.json and manifest.json.sig (the update manifest and its Ed25519 signature, signed with
# the secret CRSP_UPDATE_SIGNING_KEY; the release fails when the secret is missing),
# SHA256SUMS (covers every other asset), and a build provenance attestation for
# each asset and for SHA256SUMS itself.
#
# Owner decision D58: no signing certificate yet, so installers ship unsigned.
# The signing steps below are present but run only when the repository variable
# SIGNING_ENABLED is `true` (default: unset, off). The certificates are read from
# repository secrets only; no secret value is in this file. How a user checks
# a download: docs/guides/install.md and operations R5.43, R5.45.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  # A release is never cancelled half way.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CRSP130: a stable release comes only from a commit that is on main. Every
  # other job needs this one, so a refusal happens before any build or upload.
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRSP_UPDATE_SIGNING_KEY: ${{ secrets.CRSP_UPDATE_SIGNING_KEY }}
    steps:
      # OPS69: no build starts for a release that cannot be signed.
      - name: Update signing key is set
        run: |
          [ -n "$CRSP_UPDATE_SIGNING_KEY" ] || { echo "::error::the secret CRSP_UPDATE_SIGNING_KEY is missing; the release cannot be signed"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.ref_type == 'tag' }}
        with:
          fetch-depth: 0
      - name: Tagged commit must be on main
        if: ${{ github.ref_type == 'tag' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/ci/release-guard.sh "$SHA" origin/main

  version:
    name: version
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
      artifact-prefix: release-

  # The Windows installers (operations R5.7): one MSI per architecture, built
  # from the crsp.exe the build job made, stamped with the release version.
  msi:
    name: msi ${{ matrix.goarch }}
    needs: [version, build]
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, arch: x64 }
          - { goarch: arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-${{ matrix.goarch }}
          path: binaries
      - name: Build the MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.value }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # An edge build is stamped with the next patch after the latest stable tag.
          $edgeBase = '0.1.0'
          $last = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          if ($last -match '^v(\d+)\.(\d+)\.(\d+)$') { $edgeBase = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)" }
          ./installer/build.ps1 -Arch ${{ matrix.arch }} -Exe binaries/crsp.exe -Version $env:VERSION `
            -EdgeBase $edgeBase -Build ([int]$env:RUN_NUMBER % 65535) -Out installer/out
      # CRSP90: Authenticode signing, OFF until the owner has a certificate
      # (repository variable SIGNING_ENABLED=true). On: a missing certificate fails the job.
      - name: Sign the MSI (Authenticode)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.SIGNING_WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_WINDOWS_CERT_PASSWORD }}
          MSI: installer/out/crsp-windows-${{ matrix.goarch }}.msi
        run: |
          if (-not $env:CERT_PFX_B64) { throw 'SIGNING_ENABLED is true but the secret SIGNING_WINDOWS_CERT_PFX_B64 is empty' }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found on the runner' }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $env:MSI
            if ($LASTEXITCODE -ne 0) { throw "signtool sign exit $LASTEXITCODE" }
            & $signtool.FullName verify /pa $env:MSI
            if ($LASTEXITCODE -ne 0) { throw "signtool verify exit $LASTEXITCODE" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Stable name, no version or run number, so artifact-prune.yml keeps the newest.
          name: msi-windows-${{ matrix.goarch }}
          path: installer/out/crsp-windows-${{ matrix.goarch }}.msi
          if-no-files-found: error

  # OPS1: native installers (pkg, deb, rpm). Own job, apart from the MSI job.
  installers-unix:
    name: installers ${{ matrix.os }}-${{ matrix.arch }}
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-latest }
          - { os: darwin, arch: amd64, runner: macos-latest }
          - { os: darwin, arch: arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version.sh reads the latest stable tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: bin
      - name: Build the packages
        env:
          VERSION: ${{ needs.version.outputs.value }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x bin/crsp
          if [ "$OS" = linux ]; then
            bash installer/linux/build.sh "$ARCH" bin/crsp "$VERSION" "$GITHUB_RUN_NUMBER" pkgs
          else
            bash installer/macos/build.sh "$ARCH" bin/crsp "$VERSION" "$GITHUB_RUN_NUMBER" pkgs
          fi
          ls -l pkgs
      # CRSP90: Developer ID signing of the .pkg, OFF until the owner has a certificate
      # (repository variable SIGNING_ENABLED=true). On: a missing certificate fails the job.
      # Notarization (needs Apple account credentials) is not done here yet.
      - name: Sign the pkg (Developer ID Installer)
        if: ${{ vars.SIGNING_ENABLED == 'true' && matrix.os == 'darwin' }}
        env:
          CERT_P12_B64: ${{ secrets.SIGNING_MACOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ vars.SIGNING_MACOS_IDENTITY }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [ -n "$CERT_P12_B64" ] || { echo "::error::SIGNING_ENABLED is true but the secret SIGNING_MACOS_CERT_P12_B64 is empty"; exit 1; }
          [ -n "$IDENTITY" ] || { echo "::error::SIGNING_ENABLED is true but the variable SIGNING_MACOS_IDENTITY is empty"; exit 1; }
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpass="$(uuidgen)"
          trap 'security delete-keychain "$kc" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/sign.p12"' EXIT
          printf '%s' "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain
          productsign --sign "$IDENTITY" "pkgs/crsp-darwin-${ARCH}.pkg" "pkgs/signed.pkg"
          mv pkgs/signed.pkg "pkgs/crsp-darwin-${ARCH}.pkg"
          pkgutil --check-signature "pkgs/crsp-darwin-${ARCH}.pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: pkgs
          if-no-files-found: error

  publish:
    name: publish
    needs: [guard, version, build, msi, installers-unix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # OPS40: the version in every installer and archive name (no leading v).
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: binaries
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: msi-windows-*
          merge-multiple: true
          path: msi

      - name: Package and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          source scripts/ci/release-names.sh
          for dir in binaries/release-*; do
            target="${dir#binaries/release-}"          # e.g. linux-amd64
            goos="${target%%-*}"; goarch="${target#*-}"
            stage="stage/crsp-${target}"
            rm -rf stage && mkdir -p "$stage"
            cp "$dir"/crsp* "$stage/"
            cp LICENSE README.md "$stage/"
            chmod +x "$stage"/crsp* || true
            case "$target" in
              windows-*) (cd stage && zip -qr "../dist/$(asset_name "$VERSION" "$goos" "$goarch" zip)" "crsp-${target}") ;;
              *)         tar -C stage -czf "dist/$(asset_name "$VERSION" "$goos" "$goarch" tar.gz)" "crsp-${target}" ;;
            esac
          done
          # Installer assets join the archives here. One line per installer kind:
          # the Windows MSIs here; pkg, deb and rpm (OPS1) in the next step.
          for arch in amd64 arm64; do
            cp "msi/crsp-windows-${arch}.msi" "dist/$(asset_name "$VERSION" windows "$arch" msi)"
          done
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 8 ] || { echo "::error::expected 6 archives and 2 MSIs, found $count"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pkg-*
          path: pkgs

      # OPS1: add the .pkg, .deb and .rpm to dist, then checksum every asset.
      - name: Add native installers and checksum
        run: |
          set -euo pipefail
          # The build scripts write the stable names (crsp-<goos>-<goarch>.<ext>); the release names are
          # Crsp-<version>-<os>-<arch>.<ext>.
          source scripts/ci/release-names.sh
          for f in pkgs/*/crsp-*; do
            cp "$f" "dist/$(stable_to_asset "$VERSION" "$f")"
          done
          native=$(find dist -type f \( -name '*.pkg' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          [ "$native" -eq 6 ] || { echo "::error::expected 6 native installers, found $native"; exit 1; }
          # 6 archives + 2 MSIs + 6 native installers
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 14 ] || { echo "::error::expected 14 assets, found $count"; exit 1; }

      # CRSP90: the SBOMs (SPDX JSON), made before SHA256SUMS so the checksums cover them.
      # syft is pinned and sha256-checked in scripts/delivery/tools.json.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: SBOM (Go binary and web console)
        run: |
          set -euo pipefail
          syft="$(python3 scripts/delivery/ci_tool.py tool syft)"
          bash scripts/ci/release-sbom.sh "$syft" binaries/release-linux-amd64/crsp dist

      # OPS69: the update manifest (the format of the delivery CONTRACT.md) and its Ed25519 signature,
      # made after the packages and before SHA256SUMS, so the checksums cover both. A missing
      # CRSP_UPDATE_SIGNING_KEY fails the release.
      - name: Update manifest, signed
        env:
          CRSP_UPDATE_SIGNING_KEY: ${{ secrets.CRSP_UPDATE_SIGNING_KEY }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then channel=stable; tag="$REF_NAME"; else channel=edge; tag=edge; fi
          python3 scripts/ci/release_manifest.py --version "$VERSION" --channel "$channel" --dist dist \
            --repo "$GH_REPO" --tag "$tag" --out dist/manifest.json
          bash scripts/ci/release-sign.sh dist/manifest.json dist/manifest.json.sig

      - name: Checksum every asset
        run: |
          set -euo pipefail
          # 14 installers and archives + 2 SBOMs + the manifest and its signature
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 18 ] || { echo "::error::expected 18 assets, found $count"; exit 1; }
          # Every installer and archive is named Crsp-<version>-<os>-<arch>.<ext> (OPS69).
          bad=$(find dist -type f \( -name '*.msi' -o -name '*.pkg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
            | grep -Evc "^Crsp-${VERSION//./\\.}-(win|linux|macos)-(x64|arm64)\.(msi|deb|rpm|pkg|tar\.gz|zip)$" || true)
          [ "$bad" -eq 0 ] || { echo "::error::$bad installers or archives are not named Crsp-${VERSION}-<os>-<arch>.<ext>"; exit 1; }
          (cd dist && sha256sum Crsp-* crsp-sbom-* manifest.json manifest.json.sig > SHA256SUMS)
          lines=$(wc -l < dist/SHA256SUMS)
          [ "$lines" -eq 18 ] || { echo "::error::SHA256SUMS has $lines lines, expected 18"; exit 1; }
          cat dist/SHA256SUMS

      # One attestation for every asset and for SHA256SUMS itself.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Crsp-*
            dist/crsp-sbom-*
            dist/manifest.json
            dist/manifest.json.sig
            dist/SHA256SUMS

      - name: Publish edge pre-release (main)
        if: ${{ github.ref_type == 'branch' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/* \
            --prerelease \
            --target "$SHA" \
            --title "Edge (${SHA:0:7})" \
            --notes "Automatic build of main at ${SHA}. Not a stable release."

      - name: Publish stable release (tag)
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --verify-tag --generate-notes --notes-file docs/guides/upgrade-notes.md $flags

      # CRSP130: when GitHub found no merged PR between the previous stable tag
      # and this one, the generated notes have no "What's Changed" list; write
      # one from the commit subjects between the two tags.
      - name: Notes fallback (no What's Changed list)
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          bash scripts/ci/release-notes-fallback.sh "$TAG" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/fallback.md"
          if [ -s "$RUNNER_TEMP/fallback.md" ]; then
            { cat docs/guides/upgrade-notes.md; echo; cat "$RUNNER_TEMP/fallback.md"; } > "$RUNNER_TEMP/fallback-full.md"
            mv "$RUNNER_TEMP/fallback-full.md" "$RUNNER_TEMP/fallback.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/fallback.md"
            echo "notes written from commit subjects"
          fi
