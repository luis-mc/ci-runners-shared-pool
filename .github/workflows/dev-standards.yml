# dev-standards checks. Written by claude-setup. Make this check required on the
# default branch (claude-setup prints the gh api command; the owner runs it).
#
# How the scripts are found in CI: a pinned checkout of the dev-standards
# marketplace repo into .dev-standards-tools/. One pin, no vendored copies.
# Fill the placeholders. The pin must match the installed plugins: a newer
# luismc-docs builds docs that an older pin judges stale (G1). Keep it current
# with `python3 <claude-setup>/assets/ci_pin.py --bump` (`--check` exits 1 when stale).
#   luis-mc/dev-standards  the marketplace repository, as owner/name
#   89711a43d7eb101770b9e17317670bf2fec98a0d   a tag or full commit SHA (not a branch)
#   claude/plugins/docs/scripts        path of the docs plugin scripts inside that checkout
#   claude/plugins/docs/skills/spec-check/assets/spec_check.py          path of spec_check.py inside that checkout: claude/plugins/docs/skills/spec-check/assets/spec_check.py
#   main      the repository's default branch (claude-setup reads it
#                           with `gh repo view --json defaultBranchRef`)
name: dev-standards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOOLS: .dev-standards-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luis-mc/dev-standards
          ref: 89711a43d7eb101770b9e17317670bf2fec98a0d
          path: .dev-standards-tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Docs check (strict)
        if: hashFiles('docs/docs.json') != ''
        run: python3 "$TOOLS/claude/plugins/docs/scripts/docs_check.py" --strict
      - name: Specs check
        # spec_check.py with no file checks the dev-standards specs, so pass the project's own.
        run: |
          shopt -s nullglob
          files=(specs/*.md docs/architecture/*spec*.md)
          if [ ${#files[@]} -eq 0 ]; then echo "no spec files"; exit 0; fi
          python3 "$TOOLS/claude/plugins/docs/skills/spec-check/assets/spec_check.py" "${files[@]}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: hashFiles('scripts/design/*.test.ts') != ''
        with:
          node-version: '24'
      - name: Design system guard tests
        if: hashFiles('scripts/design/*.test.ts') != ''
        env:
          DESIGN_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          # Install with the package manager the lockfile names.
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm exec vitest run scripts/design
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn vitest run scripts/design
          else
            npm ci
            npx vitest run scripts/design
          fi
      - name: Lifecycle contract and words (LC-1, LC-2, LC-31)
        run: |
          python3 "$TOOLS/claude/plugins/docs/scripts/lifecycle_check.py" validate docs/design-system/next-version/lifecycle.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Words lint (Go)
        run: go test -timeout 10s ./scripts/design/wordslint ./internal/lifecyclewords
      - name: Design guards B to E, layout roles and lifecycle guards (DS234)
        run: |
          G=scripts/design/guards
          node $G/design-guards/none-yet.mjs docs/design-system/next-version/ux-rules.md
          node $G/design-guards/citation-test.mjs .
          node $G/design-guards/layout-roles.mjs . --config scripts/design/layout-roles.json
          node $G/design-guards/spacing-tokens.mjs packages/ui/src
          node $G/design-guards/spacing-tokens.mjs apps/web/src
          node $G/lifecycle/tray-modal.mjs internal
          if [ -d packages/ui/src/components/lifecycle ]; then node $G/lifecycle/parts-tokens.mjs packages/ui/src/components/lifecycle; fi
      - name: Rendered layout guard A and lifecycle states (DS234)
        run: |
          if ! ls docs/design-system/next-version/lifecycle-states/*.html >/dev/null 2>&1; then echo "no lifecycle state pages yet"; exit 0; fi
          pnpm exec playwright install --with-deps chromium
          export DS_NODE_MODULES="$PWD/node_modules/.pnpm/node_modules"
          G=scripts/design/guards
          # Rendered pages: the lifecycle state pages that LOOK53 builds from the shared parts.
          pages=$(ls docs/design-system/next-version/lifecycle-states/*.html 2>/dev/null || true)
          if [ -n "$pages" ]; then
            node $G/design-guards/rendered-layout.mjs $pages
            node $G/lifecycle/states-render.mjs $pages
          fi
