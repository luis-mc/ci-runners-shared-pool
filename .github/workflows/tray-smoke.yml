name: Tray smoke

# Starts the built `crsp tray` on each OS and checks it does not crash at start
# (tray R5.26, R5.27; decision 0005). Windows and macOS use the runner's desktop;
# Linux runs under xvfb with a StatusNotifierItem host on a private session bus.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'internal/tray/**'
      - 'internal/updatewindow/**'
      - 'packages/ui/src/tokens.css'
      - 'cmd/crsp/**'
      - 'packaging/autostart/**'
      - '.github/workflows/tray-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'internal/tray/**'
      - 'internal/updatewindow/**'
      - 'packages/ui/src/tokens.css'
      - 'cmd/crsp/**'
      - 'packaging/autostart/**'
      - '.github/workflows/tray-smoke.yml'
  workflow_dispatch:

concurrency:
  group: tray-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: tray-smoke ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
      - name: Build (macOS needs cgo)
        env:
          CGO_ENABLED: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir -p out
          go build -trimpath -o "out/crsp${exe}" ./cmd/crsp
          if [ "$RUNNER_OS" = "Linux" ]; then go build -o out/snihost ./internal/tray/testdata/snihost; fi
      # TRAY7: the web update window and the first-start window are plain Go (a local page, a
      # model, a browser lookup); their unit tests run on every OS, macOS included.
      - name: Window unit tests (TRAY7)
        env:
          CGO_ENABLED: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: go test -count=1 ./internal/updatewindow ./internal/tray
      - name: Install xvfb and dbus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb dbus
      - name: Smoke (Linux, xvfb, SNI host)
        if: runner.os == 'Linux'
        run: |
          cat > out/smoke.sh <<'SCRIPT'
          set -u
          ./out/snihost & host=$!
          sleep 1
          ./out/crsp tray --smoke --smoke-hold=6s & first=$!
          sleep 3
          ./out/crsp tray --smoke; second=$?
          wait "$first"; firstc=$?
          kill "$host" 2>/dev/null || true
          echo "first=$firstc second=$second"
          [ "$firstc" = 0 ] && [ "$second" = 0 ]
          SCRIPT
          timeout 60 xvfb-run -a dbus-run-session -- bash out/smoke.sh
      - name: Smoke (Linux, no tray area exits 2)
        if: runner.os == 'Linux'
        run: |
          set +e
          XDG_CONFIG_HOME="$(mktemp -d)" timeout 30 xvfb-run -a dbus-run-session -- ./out/crsp tray --smoke
          code=$?
          echo "exit=$code"
          [ "$code" = 2 ]
      - name: Smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: |
          exe="./out/crsp"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="./out/crsp.exe"; fi
          "$exe" tray --smoke --smoke-hold=6s & first=$!
          sleep 3
          "$exe" tray --smoke; second=$?
          wait "$first"; firstc=$?
          echo "first=$firstc second=$second"
          [ "$firstc" = 0 ] && [ "$second" = 0 ]
      # TRAY5: the native update window. The layout check builds the window off screen for every
      # state at 100, 125, 150 and 200% with the real fonts and exits 1 when anything is clipped;
      # it also draws a PNG of each (the same drawing code as the window).
      - name: Update window layout check and screenshots (Windows)
        if: runner.os == 'Windows'
        run: ./out/crsp.exe update-window --layout-check --screenshots out/update-window-shots
      # One window only: a second start focuses the first and ends at once.
      - name: Update window opens once (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $args1 = 'update-window', '--mode', 'review', '--from', '0.1.12', '--to', '0.1.13'
          $first = Start-Process ./out/crsp.exe -ArgumentList $args1 -PassThru
          Start-Sleep -Seconds 5
          if ($first.HasExited) { throw "the first update window ended with $($first.ExitCode)" }
          $second = Start-Process ./out/crsp.exe -ArgumentList $args1 -PassThru
          if (-not $second.WaitForExit(15000)) { $second.Kill(); throw 'the second update window did not end' }
          if ($second.ExitCode -ne 0) { throw "the second update window ended with $($second.ExitCode)" }
          if ($first.HasExited) { throw 'the first update window must still be open' }
          $first.Kill()
      - name: Upload the update window screenshots (Windows)
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-window-screenshots
          path: out/update-window-shots
          if-no-files-found: ignore
