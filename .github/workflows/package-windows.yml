name: Package Windows

# CIR10 W5. OPTIONAL: for a product that ships a Windows installer. The MSI is built ON WINDOWS.
# Artifacts are held until the publish succeeds:
#   - the clean-up job runs only when no publish job failed or was cancelled;
#   - artifact-prune.yml holds `windows-installer` while the newest run of this workflow has not
#     succeeded (artifact_prune.py --hold windows-installer --hold-workflow package-windows.yml);
#   - the token request retries a 5xx answer after 1, 2 and 4 seconds (publish_token.py).
# Release assets are named Crsp-<version>-win-<arch>.msi (OPS69), and the
# same names in SHA256SUMS. The CI build artifact `windows-installer` keeps its stable name (DL-22).
# PRODUCT: fill the build and publish commands. Re-running failed jobs then finds the installer.
# CRSP145: not run on tag pushes. release.yml builds, signs and publishes the MSI for every tag;
# this template's build step is a placeholder and produced no build/*.msi there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DELIVERY_SHARD: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CRSP17: the MSI task adds installer/; until then the steps below are skipped.
      - name: Is there an installer to build
        id: gate
        shell: bash
        run: if [ -d installer ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      # PRODUCT: build the installer here; the compression level is `high` on Windows.
      - name: Build the installer
        if: steps.gate.outputs.present == 'true'
        run: echo "PRODUCT - build the MSI"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.present == 'true'
        with:
          name: windows-installer
          path: build/*.msi
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: publish
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the installer
        run: gh run download "$GITHUB_RUN_ID" --name windows-installer
        env:
          GH_TOKEN: ${{ github.token }}
      # OPS69: the release asset is Crsp-<version>-win-<arch>.msi (scripts/ci/release-names.sh); the version
      # is the tag without `v`, the arch x64 or arm64.
      - name: Name the release assets
        env:
          REF_NAME: ${{ github.ref_name }}
          ASSET_ARCH: x64
        run: |
          source scripts/ci/release-names.sh
          mkdir -p release
          version="${REF_NAME#v}"
          for f in *.msi; do
            cp "$f" "release/$(asset_name "$version" win "$ASSET_ARCH" msi)"
          done
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Get the publish token (retries 5xx)
        run: python3 scripts/delivery/publish_token.py --url "$TOKEN_URL" --out "$RUNNER_TEMP/token"
        env:
          TOKEN_URL: ${{ vars.PUBLISH_TOKEN_URL }}
      # PRODUCT: publish the files in release/ (the msi and SHA256SUMS) with the token in $RUNNER_TEMP/token.

  clean-artifacts:
    needs: [build, publish]
    # Only when nothing failed or was cancelled: a failed publish keeps its installer.
    if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    env:
      DELIVERY_SHARD: clean-artifacts
    permissions:
      actions: write
    steps:
      - name: Delete the installer artifact of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="windows-installer") | .id')
          for id in $ids; do gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
