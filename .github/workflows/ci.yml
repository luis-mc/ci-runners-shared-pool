name: CI

# STACKSPEC 13.1: the twelve required gates. Tool choices are recorded in
# docs/architecture/stack-profile.md. GitHub-hosted runners only; this workflow
# does not depend on any delivery plugin.
#
#   lint     secret scan over full history, workflow lint, CI script tests, format,
#            Go and web lint, layer boundaries                                 (CRSP209)
#   types    lockfile tidy, codegen drift, go vet, web typecheck, dependency scan
#   tests    unit + integration + route-coverage tests (Go race, vitest)
#   verify   the one name a required check matches: green when lint, types and tests are
#            green (the three run in parallel; they were one serial job of 10 to 17 min)
#   test-os  go test on Windows and macOS
#   build    the six release targets (build.yml); artifacts crsp-<os>-<arch>
#   e2e      Playwright against the built Linux binary
#
# CRSP324: `decide` also plans the areas a change touches (scripts/delivery/area_select.py with
# scripts/delivery/ci-areas.json) and each job runs only for its areas, by a job-level `if`
# (never a workflow-level paths filter). An unknown path, a release pull request, a push to
# main and a failed plan all run everything. A job the plan skips is a planned skip, not a failure.
#
# CRSP349 (DS287, R5.88-R5.95): `carry` plans what an earlier head of the pull request already proved
# (scripts/delivery/carry_plan.py through .github/actions/carry-plan, with the same ci-areas.json). A job whose
# last run on an earlier head was green and that no change since reaches is skipped and named in `carried`;
# every required aggregate (tests, verify, e2e) and `carry-ok` count a carried skip as passed
# (scripts/delivery/carry_verify.py). The first run of a pull request, a failed plan and a dispatch run
# run everything. A fix push re-runs the failed and the touched jobs only.
#
# Documentation-only changes skip this workflow (paths-ignore). Repo-config-only pull requests
# (.claude, .nvmrc, .gitignore, .delivery/config.json) still start it, and `decide` skips every
# job, so the run is green and the delivery watcher finds it (DS261, S15).
on:
  pull_request:
    # Drafts are skipped by the job-level `if`; ready_for_review starts the run
    # when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  # CRSP201: a newer run of this workflow on the same ref cancels the superseded
  # one, for every event: pull_request, and also the workflow_dispatch runs that
  # scripts/delivery/agent_ci.py and manual re-runs start on integration and agent
  # branches (7 of the last 100 runs were dispatches on non-main refs, 3 of them
  # cancelled by hand or by timeout). A run on main is never cancelled: a merged
  # commit must not be left unverified.
  # The group carries the event so a pull_request run (ref refs/pull/N/merge) and
  # a dispatch run (ref refs/heads/<branch>) never cancel each other, and on main
  # a dispatch cannot replace a pending push run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # CRSP209 (DL-97/DL-98): a release run (head branch *-integration or *-release-N) is never cancelled
  # while its jobs run, red or green; a newer push waits in the group instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !endsWith(github.head_ref, '-integration') && !endsWith(github.ref, '-integration') && !contains(github.head_ref, '-release-') && !contains(github.ref, '-release-') }}

permissions:
  contents: read

jobs:
  # STACKSPEC 13.1: a push to main whose tree already passed this workflow on a
  # pull request skips the suite. Pull requests always run. If this job fails or
  # is skipped the suite still runs (every job tests the result, not success()).
  decide:
    name: decide
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      image: ${{ steps.image-scope.outputs.image }}
      release: ${{ steps.release.outputs.release }}
      areas: ${{ steps.areas.outputs.areas }}
      # The area plan names the jobs by their workflow job key (scripts/delivery/ci-areas.json), the
      # same names the carry plan uses; go_win_lint is a step of lint, not a job.
      go-race: ${{ steps.areas.outputs.go-race }}
      web-tests: ${{ steps.areas.outputs.web-tests }}
      test-os: ${{ steps.areas.outputs.test-os }}
      go_win_lint: ${{ steps.areas.outputs.go_win_lint }}
      build: ${{ steps.areas.outputs.build }}
      e2e-shards: ${{ steps.areas.outputs.e2e-shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The area plan diffs against the base branch, so it needs the history.
          fetch-depth: 0
          sparse-checkout: |
            scripts/ci
            scripts/delivery
      # DS287 (R5.94): a tracked file that no area, `docs` glob or `run_everything` entry names fails the
      # pull request and is listed, so it never silently runs every job.
      - name: Every tracked file is mapped (R5.94)
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/delivery/area_select.py --unmapped --check
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/ci_skip_check.py
      # OPS41: the base image build is slow. It runs on a release pull request
      # (head branch *-integration or *-release-N), on main and on a manual run; on any other
      # pull request only when images/** or the build or ci workflow changed.
      - id: image-scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/ci/image_scope.py
      # CRSP209 (DL-97/DL-98): a release pull request is a ready pull request whose head
      # branch ends in -integration or -release-N. Its run never stops at the first failure and never
      # skips a job: e2e and the image do not wait for format, lint and types to pass.
      # Every other run (agent branch, draft made ready, dispatch) lets lint and types
      # gate those two jobs, so a typo does not cost a 30-minute run.
      - id: release
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          release=false
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" != "true" ] && { [[ "$HEAD_REF" == *-integration ]] || [[ "$HEAD_REF" =~ -release-[0-9]+$ ]] || [[ "$HEAD_REF" =~ ^release/ ]]; }; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # CRSP324: which areas the change touches. A release pull request, a push to main and a failed
      # plan run everything (empty outputs mean everything: every job tests `!= 'false'`).
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ steps.release.outputs.release }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=(--github-output)
          if [ "$RELEASE" = "true" ] || [ "$EVENT" = "push" ]; then
            args+=(--all)
          else
            base="${BASE_REF:-$DEFAULT_BRANCH}"
            git fetch --no-tags --quiet origin "$base" || true
            args+=(--base "origin/$base")
          fi
          python3 scripts/delivery/area_select.py "${args[@]}" || echo "::warning::area plan failed, every job runs"

  # CRSP349 (DS287, R5.88, R5.91, R5.95): the carry-forward plan. A job it carries is skipped and counted as
  # passed by the aggregates below. An empty plan (a failed or skipped plan job, a dispatch run) runs everything.
  carry:
    name: carry plan
    needs: decide
    if: ${{ always() && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read  # R5.95: the merged pull request of a push to the default branch
    outputs:
      plan: ${{ steps.adjust.outputs.plan }}
      carried: ${{ steps.adjust.outputs.carried }}
      reason: ${{ steps.adjust.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan diffs the pull request against its base and against each proof head.
          fetch-depth: 0
      - id: plan
        continue-on-error: true
        uses: ./.github/actions/carry-plan
        with:
          workflow: ci.yml
          # R5.95: on a push to the default branch these jobs always run (they save the caches main serves).
          always: image,e2e-shards,build
          default-branch: ${{ github.event.repository.default_branch }}
      # The base image and the e2e shards download the crsp binary of THIS run, so they need the build job: it runs
      # whenever either of them runs. A change to build.yml (a called workflow, which the plan reads as another
      # workflow's file) since the proof head re-runs the build too.
      - id: adjust
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          CARRIED: ${{ steps.plan.outputs.carried }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: python3 scripts/delivery/carry_adjust.py
      - name: Carry plan
        env:
          REASON: ${{ steps.adjust.outputs.reason }}
          CARRIED: ${{ steps.adjust.outputs.carried }}
        run: |
          echo "carry plan: $REASON"
          echo "carried jobs: $CARRIED"

  # CRSP209: verify was one serial job of 9.6 to 17 min. The same checks now run in
  # three parallel jobs and the `verify` job at the end keeps the name a required
  # check matches.
  lint:
    name: lint
    needs: [decide, carry]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && fromJSON(needs.carry.outputs.plan || '{}')['run_lint'] != 'false' }}
    # CRSP268: pool first. CRSP_LINT, else CRSP_RUNS_ON_LINUX (crsp-home labels), else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CRSP_LINT || vars.CRSP_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history. At the default clone depth it would examine
          # one commit and report clean: an absent check posing as a passing one.
          fetch-depth: 0

      # 11 secret scan over full history (STACKSPEC 12). Pinned release, checksum
      # verified. Runs first so a leaked secret fails fast.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="HEAD"
          rm -f gitleaks gitleaks.tgz

      # Workflow lint (actionlint runs shellcheck on run: blocks; the runner image
      # ships shellcheck). Pinned release, checksum verified, same as gitleaks.
      - name: Workflow lint (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tgz

      - uses: ./.github/actions/go-cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-cache

      # CRSP341: the secret scan is never allowlisted; a pull request may not add a line.
      - name: No additions to .gitleaksignore
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/gitleaksignore_guard.py --base "origin/${BASE_REF}"

      - name: CI scripts unit tests
        run: |
          # CRSP319: a cold module cache (no main entry yet) would download inside the 10 s
          # test timeout of test_ci_tiers (go list); with a warm cache this is a no-op.
          go mod download
          python3 -m pip install --quiet -r scripts/ci/requirements-test.txt
          python3 -m pytest scripts/ci

      # 1 install from the committed lockfiles, frozen.
      - name: Install (frozen)
        run: |
          go mod download
          go mod verify
          pnpm install --frozen-lockfile

      # 4 format
      - name: Format (gofmt, prettier)
        run: |
          bash scripts/ci/gofmt-check.sh
          pnpm run format:check

      # 3 lint and 12 layer boundaries (depguard rules in .golangci.yml)
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build from source with the Go toolchain this repository pins.
          install-mode: goinstall
      # Windows-only files (*_windows.go) are invisible to the Linux pass above.
      # The macOS pass stays out: fyne.io/systray needs cgo and cannot typecheck cross-built.
      # CRSP324 (S12): skipped when no .go, go.mod or Windows file changed; any .go file keeps it.
      - name: Lint (Go, GOOS=windows)
        if: ${{ needs.decide.outputs.go_win_lint != 'false' }}
        run: |
          GOBIN="$RUNNER_TEMP/golangci-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          GOOS=windows "$RUNNER_TEMP/golangci-bin/golangci-lint" run ./...
      - name: Lint (web)
        run: |
          pnpm -r lint
          pnpm run lint:root

  types:
    name: codegen and types
    needs: [decide, carry]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && fromJSON(needs.carry.outputs.plan || '{}')['run_types'] != 'false' }}
    # CRSP268: pool first. CRSP_TYPES, else CRSP_RUNS_ON_LINUX (crsp-home labels), else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CRSP_TYPES || vars.CRSP_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-cache

      # 1 install from the committed lockfiles, frozen.
      - name: Install (frozen)
        run: |
          go mod download
          go mod verify
          pnpm install --frozen-lockfile
      - name: Go lockfile is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "::error::go.mod/go.sum are not tidy. Run go mod tidy and commit."; exit 1; }

      # 2 codegen drift: regenerate everything, fail if a generated file changed.
      - name: Codegen drift
        run: bash scripts/ci/codegen-drift.sh

      # 5 type check
      - name: Type check
        run: |
          go vet ./...
          pnpm run typecheck

      # 10 dependency scan
      - name: Dependency scan
        run: |
          go tool govulncheck ./...
          pnpm audit --prod

  # CRSP313: the Go race tests took 11.7 min in one job. They run in 4 shards (GO_TEST_SHARD=K/N,
  # scripts/ci/go-tiers.mjs): every package and every chunk of a slow package runs under -race
  # in exactly one shard, balanced by recorded seconds (scripts/ci/go-tiers.json).
  go-race:
    name: Go tests (race) ${{ matrix.shard }}
    needs: [decide, carry]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && needs.decide.outputs.go-race != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && fromJSON(needs.carry.outputs.plan || '{}')['run_go-race'] != 'false' }}
    # CRSP268: pool first. CRSP_TESTS, else CRSP_RUNS_ON_LINUX (crsp-home labels), else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CRSP_TESTS || vars.CRSP_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # CRSP318: a workflow_dispatch run (agent and dispatch branches) after a red dispatch run on the
      # same branch re-runs only this shard's failed tests plus the changed Go packages. Pull request,
      # main and release runs never come here: they keep the full suite. fetch-depth 0 for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
      - uses: ./.github/actions/go-cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Go modules
        run: |
          go mod download
          go mod verify
      # The zero-test guard fails the step when no Go test ran (STACKSPEC 11.3).
      # go-test.sh runs the packages in tiers, each with its own -timeout (G1).
      # A failing test never stops the run: no -failfast.
      - name: Plan narrowed rerun (dispatch runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && needs.decide.outputs.release != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 scripts/ci/rerun_plan.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
          --run-id "$GITHUB_RUN_ID" --shard "${{ matrix.shard }}/4" --job-name "Go tests (race) ${{ matrix.shard }}"
          --artifact "ci-go-test-times-linux-${{ matrix.shard }}" --out "$RUNNER_TEMP/go-rerun.json"
      - name: Go tests (race)
        env:
          CGO_ENABLED: '1'
          GO_TEST_SHARD: ${{ matrix.shard }}/4
          GO_TEST_RERUN: ${{ runner.temp }}/go-rerun.json
        run: bash scripts/ci/go-test.sh -race
      # CRSP201: go-test.sh logs only failures and a summary; the JSON keeps every
      # test's time. The name is stable, so artifact-prune keeps the newest of each.
      - name: Upload Go test times
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-go-test-times-linux-${{ matrix.shard }}
          path: test-results/go-test.json
          if-no-files-found: ignore
          retention-days: 3

  # CRSP349: the job key is `web-tests`, so the carry plan does not confuse it with the `tests` check below.
  web-tests:
    name: web tests and lifecycle conformance
    needs: [decide, carry]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && needs.decide.outputs.web-tests != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && fromJSON(needs.carry.outputs.plan || '{}')['run_web-tests'] != 'false' }}
    # CRSP268: pool first. CRSP_TESTS, else CRSP_RUNS_ON_LINUX (crsp-home labels), else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CRSP_TESTS || vars.CRSP_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-cache

      # 1 install from the committed lockfiles, frozen.
      - name: Install (frozen)
        run: |
          go mod download
          go mod verify
          pnpm install --frozen-lockfile

      # CRSP313: the Go race tests run in the go-race shards; the `tests-result` job below reports them with this job.
      # OPS68: the updater passes the lifecycle conformance runner (LC-3 to LC-7, LC-25, LC-26, LC-28).
      # The test interface is its own command, built only here and never shipped.
      - name: Lifecycle conformance (updater)
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/crsp-lifecycle-test" ./apps/controller/cmd/crsp-lifecycle-test
          "$RUNNER_TEMP/crsp-lifecycle-test" --addr 127.0.0.1:7391 &
          pid=$!
          trap 'kill "$pid"' EXIT
          python3 scripts/delivery/lifecycle_conformance.py --url http://127.0.0.1:7391
      - name: Web tests and guards
        if: ${{ always() }}
        run: pnpm exec vitest run

  # CRSP313: the name `tests` stays one check: green only when the Go race shards and the web
  # tests are green. Skipped, like the single job it replaces, when decide skips the run or the
  # pull request is a draft.
  tests-result:
    name: tests
    needs: [decide, carry, go-race, web-tests]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Go race shards and web tests succeeded
        env:
          GO: ${{ needs.go-race.result }}
          WEB: ${{ needs.web-tests.result }}
          GO_PLAN: ${{ needs.decide.outputs.go-race }}
          WEB_PLAN: ${{ needs.decide.outputs.web-tests }}
          CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
        run: |
          echo "go-race=$GO (plan $GO_PLAN) web=$WEB (plan $WEB_PLAN)"
          # A job the area plan skipped is skipped on purpose; a job the carry plan skipped passed on an
          # earlier head (CRSP349); a skip that neither asked for is a failure.
          carried() { echo "$CARRIED" | jq -e --arg j "$1" 'has($j)' >/dev/null; }
          [ "$GO" = "success" ] || { [ "$GO" = "skipped" ] && { [ "$GO_PLAN" = "false" ] || carried go-race; }; }
          [ "$WEB" = "success" ] || { [ "$WEB" = "skipped" ] && { [ "$WEB_PLAN" = "false" ] || carried web-tests; }; }

  # The name a required check matches: green only when lint, types and tests are.
  # Skipped, like the single job it replaces, when decide skips the run or the pull
  # request is a draft.
  verify:
    name: verify
    needs: [decide, carry, lint, types, tests-result]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lint, types and tests succeeded
        env:
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TESTS: ${{ needs.tests-result.result }}
          CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
        run: |
          echo "lint=$LINT types=$TYPES tests=$TESTS"
          # CRSP349: lint and types skipped by the carry plan passed on an earlier head.
          carried() { echo "$CARRIED" | jq -e --arg j "$1" 'has($j)' >/dev/null; }
          [ "$LINT" = "success" ] || { [ "$LINT" = "skipped" ] && carried lint; }
          [ "$TYPES" = "success" ] || { [ "$TYPES" = "skipped" ] && carried types; }
          [ "$TESTS" = "success" ]

  test-os:
    name: Go tests (${{ matrix.os }})
    needs: [decide, carry]
    # CRSP324 (S12): macOS and Windows run only when a Go file, go.mod or a Windows file changed.
    if: ${{ always() && needs.decide.outputs.skip != 'true' && needs.decide.outputs.test-os != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && fromJSON(needs.carry.outputs.plan || '{}')['run_test-os'] != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests
        shell: bash
        run: bash scripts/ci/go-test.sh
      - name: Upload Go test times
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-go-test-times-${{ matrix.os }}
          path: test-results/go-test.json
          if-no-files-found: ignore
          retention-days: 3
      # doctor R5.42, runners R5.68: the unit tests fake the link, so this one
      # step makes a real symbolic link with Developer Mode on (Windows only).
      - name: Real symbolic link (Windows, Developer Mode on)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        env:
          CRSP_REAL_SYMLINK: '1'
        run: |
          reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' //t REG_DWORD //f //v AllowDevelopmentWithoutDevLicense //d 1
          go test -timeout 10s -count=1 -v -run '^TestProbeSymlinkReal$' ./apps/controller/internal/agent/

  # OPS69: the Windows MSI lifecycle lanes (x64 on windows-latest, arm64 on windows-11-arm) and the
  # release check. A release pull request fails unless every target lane passed.
  lifecycle:
    name: lifecycle
    needs: decide
    if: ${{ always() && needs.decide.outputs.release == 'true' && needs.decide.outputs.skip != 'true' }}
    uses: ./.github/workflows/lifecycle.yml
    with:
      release: true

  build:
    name: build
    needs: [decide, carry]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && needs.decide.outputs.build != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && fromJSON(needs.carry.outputs.plan || '{}')['run_build'] != 'false' }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.sha }}

  # runners R5.49: the Linux base job image builds. Build only, no push.
  # runners R5.43: the matrix lists amd64 and arm64. Every layer builds on
  # amd64; arm64 builds the base image and the llvm layer, the only layer with
  # an arm64 pin (the others carry amd64-only tools). amd64 took 15 to 18 min
  # from scratch (20 cancelled it twice on 19 Nov). CRSP209: the limit is 30 (G2): the
  # llvm layer (10.7 min, rebuilt every run) should now come from the cache, see below.
  #
  # OPS41: the job runs only when decide says so (image-scope). Every image is
  # built with buildx and the GitHub Actions cache, one cache scope per arch
  # and image, so an unchanged layer is reused. The crsp binary changes on every
  # commit, so the slow layers sit in the `tools` stage of the base Dockerfile
  # (built with --target tools, cached) and the tool layers build on that stage
  # through a local registry on the runner; the base image itself is the tools
  # stage plus the crsp binary. Every self-check step stays.
  image:
    name: base image ${{ matrix.arch }} (build only)
    needs: [decide, carry, build, lint, types]
    # A release pull request starts as soon as the build is done; any other run waits for
    # lint and types to pass (CRSP209, DL-97/DL-98). CRSP349: a lint or types job skipped by the carry plan
    # passed on an earlier head, so `skipped` counts here (it is skipped for no other reason in this run).
    if: ${{ always() && needs.decide.outputs.skip != 'true' && needs.decide.outputs.image != 'false' && needs.build.result == 'success' && fromJSON(needs.carry.outputs.plan || '{}')['run_image'] != 'false' && (needs.decide.outputs.release == 'true' || ((needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.types.result == 'success' || needs.types.result == 'skipped'))) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, all: true }
          - { arch: arm64, runner: ubuntu-24.04-arm, all: false }
    services:
      # Holds the tools-stage base image and the linux-packaging layer for the
      # layers that build on them. Local to the job, never published.
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      REG: localhost:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crsp-linux-${{ matrix.arch }}
          path: images/linux-base
      - run: chmod +x images/linux-base/crsp
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # host network: the builder reaches the registry service on localhost.
          driver-opts: network=host
      # CRSP323: this repository's own CI only (public repo, free). The tools stage is
      # stored as a public ghcr.io package tagged by a key over its inputs
      # (scripts/ci/image_key.py). Only a run on main pushes it (base-image.yml, the job
      # with packages: write); this job only reads, anonymously. Any error is a miss and
      # the stage builds as before.
      - name: Key of the stored tools stage
        id: key
        run: python3 scripts/ci/image_key.py key --arch "${{ matrix.arch }}" --extra "EXTRA_PACKAGES=zlib1g-dev libc++-dev"
      - name: Look up the stored tools stage
        id: stored
        env:
          KEY: ${{ steps.key.outputs.key }}
          ARCH: ${{ matrix.arch }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/base-${ARCH}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          start=$(date +%s)
          python3 scripts/ci/image_key.py lookup --repo "$repo" --key "$KEY"
          echo "lookup ${repo}:${KEY}: $(( $(date +%s) - start )) s"
      # A hit: copy the image by digest into the job's local registry, the place the
      # build below would have put it. The copy keeps the digest, so the layers that build
      # on it keep their cache keys.
      - name: Reuse the stored tools stage
        id: copy
        if: ${{ steps.stored.outputs.hit == 'true' }}
        env:
          REPO: ${{ steps.stored.outputs.repo }}
          DIGEST: ${{ steps.stored.outputs.digest }}
          RUN_ID: ${{ steps.stored.outputs.run_id }}
        run: |
          src="${REPO}@${DIGEST}"
          dst="${REG}/crsp-linux-base-tools:ci"
          start=$(date +%s)
          if docker buildx imagetools create --tag "$dst" "$src" \
            || { docker pull "$src" && docker tag "$src" "$dst" && docker push "$dst"; }; then
            took=$(( $(date +%s) - start ))
            echo "reused image ${DIGEST} built by main (run ${RUN_ID}), copied in ${took} s"
            echo "- ${{ matrix.arch }}: reused image \`${DIGEST}\` built by main (run ${RUN_ID}), copied in ${took} s" >> "$GITHUB_STEP_SUMMARY"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "copy failed: the tools stage builds"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      # The slow part: the tools stage (apt, node, gh, the Actions runner).
      - name: docker build base tools stage (no publish)
        if: ${{ steps.copy.outputs.reused != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/linux-base
          target: tools
          build-args: TARGETARCH=${{ matrix.arch }}
          tags: ${{ env.REG }}/crsp-linux-base-tools:ci
          push: true
          # CRSP209: the layers below build FROM this image. A provenance attestation
          # carries a timestamp, so the pushed digest changed on every run and every
          # layer built on it missed its cache (llvm: 10.7 min each run). Without the
          # attestation the same cached layers push to the same digest.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=base-${{ matrix.arch }}' || '' }}
      - name: docker build base image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/linux-base
          # CRSP323: on a reuse the last stage builds on the stored tools stage, else on the stage.
          build-args: |
            TARGETARCH=${{ matrix.arch }}
            BASE_IMAGE=${{ steps.copy.outputs.reused == 'true' && format('{0}/crsp-linux-base-tools:ci', env.REG) || 'tools' }}
          tags: crsp-linux-base:ci
          load: true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
      - name: Job user is not root and tools run
        run: |
          docker run --rm crsp-linux-base:ci bash -ec 'test "$(id -u)" != 0; node --version; corepack --version; command -v pnpm; gh --version | head -1; crsp version'
      - name: Actions runner is in the image and runs as the job user
        run: |
          want="$(sed -n 's/^ARG RUNNER_VERSION=//p' images/linux-base/Dockerfile)"
          # run.sh prints the version, then its exit lines: keep the first line.
          got="$(docker run --rm crsp-linux-base:ci /opt/actions-runner/run.sh --version | sed -n 1p)"
          test "$got" = "$want" || { echo "runner version '$got', pinned '$want'"; exit 1; }
          docker run --rm crsp-linux-base:ci bash -ec 'test "$(id -u)" != 0; test -w /opt/actions-runner; cp -a /opt/actions-runner /tmp/r && /tmp/r/config.sh --version'
      # runners R5.44: the browsers layer builds on the base image (its build
      # launches each browser headless as the self-check). Build only, no push.
      - name: docker build browsers layer (no push)
        if: ${{ matrix.all }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/layers/browsers
          build-args: BASE_IMAGE=${{ env.REG }}/crsp-linux-base-tools:ci
          tags: crsp-linux-browsers:ci
          load: true
          cache-from: type=gha,scope=browsers-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=browsers-${{ matrix.arch }}' || '' }}
      - name: Browsers sit at the fixed path
        if: ${{ matrix.all }}
        run: |
          docker run --rm crsp-linux-browsers:ci bash -ec 'test "$PLAYWRIGHT_BROWSERS_PATH" = /opt/crsp/browsers; test -n "$(ls /opt/crsp/browsers)"; test "$(id -u)" != 0'
      # runners R5.50: each layer builds on the base image. Build only, no push.
      # The build runs the layer's self-check, so a missing tool fails here.
      - name: docker build windows-packaging layer (no push)
        if: ${{ matrix.all }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/layers/windows-packaging
          build-args: |
            BASE_IMAGE=${{ env.REG }}/crsp-linux-base-tools:ci
            TARGETARCH=${{ matrix.arch }}
          tags: crsp-layer-windows-packaging:ci
          load: true
          cache-from: type=gha,scope=windows-packaging-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=windows-packaging-${{ matrix.arch }}' || '' }}
      # The extra packages layer builds on this one, so it goes to the registry.
      - name: docker build linux-packaging layer (no push)
        if: ${{ matrix.all }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/layers/linux-packaging
          build-args: |
            BASE_IMAGE=${{ env.REG }}/crsp-linux-base-tools:ci
            TARGETARCH=${{ matrix.arch }}
          tags: ${{ env.REG }}/crsp-layer-linux-packaging:ci
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=linux-packaging-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=linux-packaging-${{ matrix.arch }}' || '' }}
      # CRSP209: its own cache scope (llvm-<arch>) read and written here; with the
      # base digest should now be stable (provenance off above) the 10.7 min layer is a cache hit.
      - name: docker build llvm layer (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/layers/llvm
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ env.REG }}/crsp-linux-base-tools:ci
            TARGETARCH=${{ matrix.arch }}
          tags: crsp-layer-llvm:ci
          load: true
          cache-from: type=gha,scope=llvm-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=llvm-${{ matrix.arch }}' || '' }}
      - name: docker build kvm layer (no push)
        if: ${{ matrix.all }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/layers/kvm
          build-args: |
            BASE_IMAGE=${{ env.REG }}/crsp-linux-base-tools:ci
            TARGETARCH=${{ matrix.arch }}
          tags: crsp-layer-kvm:ci
          load: true
          cache-from: type=gha,scope=kvm-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=kvm-${{ matrix.arch }}' || '' }}
      # runners R5.51: the extra packages layer is last, on top of a packaging
      # layer, with a list of names (CRSP60). Build only, no push.
      - name: docker build extra packages layer (no push)
        if: ${{ matrix.all }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/layers/extra-packages
          build-args: |
            BASE_IMAGE=${{ env.REG }}/crsp-layer-linux-packaging:ci
            EXTRA_PACKAGES=zlib1g-dev libc++-dev
          tags: crsp-layer-extra-packages:ci
          load: true
          cache-from: type=gha,scope=extra-packages-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=extra-packages-${{ matrix.arch }}' || '' }}
      - name: Extra packages layer refuses a bad name
        if: ${{ matrix.all }}
        run: |
          if docker buildx build --output type=cacheonly --build-arg "BASE_IMAGE=${REG}/crsp-linux-base-tools:ci" --build-arg "EXTRA_PACKAGES=ok;rm" images/layers/extra-packages; then echo "a bad name was accepted"; exit 1; fi
      - name: llvm layer tools run as the job user
        run: |
          docker run --rm crsp-layer-llvm:ci bash -ec 'test "$(id -u)" != 0; clang-cl --version | head -1; lld-link --version | head -1; command -v llvm-lib'
      - name: Layer tools run as the job user
        if: ${{ matrix.all }}
        run: |
          docker pull "${REG}/crsp-layer-linux-packaging:ci"
          docker tag "${REG}/crsp-layer-linux-packaging:ci" crsp-layer-linux-packaging:ci
          docker run --rm crsp-layer-linux-packaging:ci bash -ec 'test "$(id -u)" != 0; dpkg-buildpackage --version | head -1; fakeroot --version | head -1; rpmbuild --version'
          docker run --rm crsp-layer-windows-packaging:ci bash -ec 'test "$(id -u)" != 0; dotnet --version; wine --version; command -v xvfb-run xauth msiinfo'
          docker run --rm crsp-layer-extra-packages:ci bash -ec 'test "$(id -u)" != 0; dpkg -s zlib1g-dev libc++-dev >/dev/null; command -v dpkg-deb'
          docker run --rm crsp-layer-kvm:ci bash -ec 'test "$(id -u)" != 0; qemu-system-x86_64 --version | head -1; kvm-wait.sh true'

  # CRSP192: the layout guards (ux-routes.spec.ts, about 1,700 cases) outgrew one
  # 30-minute job, so the specs run in 4 shards. Each shard has its own budget.
  e2e-shards:
    name: e2e shard ${{ matrix.shard }}
    needs: [decide, carry, build, lint, types]
    # A release pull request never waits for lint and types and is never skipped; any
    # other run waits for them to pass (CRSP209, DL-97/DL-98). CRSP349: `skipped` lint or types is a carry.
    if: ${{ always() && needs.decide.outputs.skip != 'true' && needs.decide.outputs.e2e-shards != 'false' && needs.build.result == 'success' && fromJSON(needs.carry.outputs.plan || '{}')['run_e2e-shards'] != 'false' && (needs.decide.outputs.release == 'true' || ((needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.types.result == 'success' || needs.types.result == 'skipped'))) }}
    # CRSP268: pool first. CRSP_E2E, else CRSP_RUNS_ON_LINUX (crsp-home labels), else GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CRSP_E2E || vars.CRSP_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-cache
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crsp-linux-amd64
          path: bin
      - run: chmod +x bin/crsp
      # CRSP201: `playwright install --with-deps` took about 190 s per shard. The browser
      # download is cached per runner OS and the exact @playwright/test version
      # from pnpm-lock.yaml; the browser builds are fixed by that version. Playwright's
      # own installer fetches the browser, so DL-94 (ci_tool.py) does not apply.
      # CRSP315: the system packages come from a cache of their .deb files, so a hit
      # reads no Ubuntu mirror (apt-get update and install-deps took 10 to 40 s per shard
      # and up to 8 min when a mirror served 404s). CRSP319: restore everywhere, save on
      # main only.
      - name: Playwright version
        id: pw
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Restore Playwright system packages (.deb files)
        id: pw-deb
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/pw-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Playwright system packages (cached .deb files)
        if: steps.pw-deb.outputs.cache-hit == 'true'
        # apt-get orders an upgrade set that a single dpkg call cannot (libasound2-data breaks the
        # old libasound2t64). The files are local, so no mirror is read; unsafe-io skips fsync on
        # a runner that is thrown away.
        run: sudo apt-get install -y --no-install-recommends --no-download -o DPkg::Options::=--force-unsafe-io "$HOME"/pw-debs/*.deb || pnpm exec playwright install-deps chromium
      - name: Install Playwright system packages (apt, then keep the .deb files)
        if: steps.pw-deb.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          sudo rm -f /var/cache/apt/archives/*.deb
          pnpm exec playwright install-deps chromium
          mkdir -p "$HOME/pw-debs"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/pw-debs/"
          sudo chown -R "$USER" "$HOME/pw-debs"
      - name: Save Playwright browsers (main only)
        if: github.ref == 'refs/heads/main' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      - name: Save Playwright system packages (main only)
        if: github.ref == 'refs/heads/main' && steps.pw-deb.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/pw-debs
          key: ${{ steps.pw-deb.outputs.cache-primary-key }}

      # Required. No retries, no continue-on-error (STACKSPEC 11.2, 11.3).
      # CRSP209: Playwright's own --shard split by test count, so one shard ran 4.9 min
      # and another 9.5. CRSP313: the split still left 13 and 6 min, because the 223 s a11y
      # file ran alone while ux-routes.spec.ts (about 1,700 parallel cases) was cut in four
      # equal quarters. scripts/ci/e2e_plan.py now gives each shard its spec files and its
      # slices of ux-routes.spec.ts (`--shard=a/16`, one run each) by recorded time
      # (scripts/ci/e2e-weights.json), so the shards end about together. Every file and
      # every slice 1..16 belongs to exactly one shard. No run stops another.
      - name: Playwright (gating specs)
        env:
          E2E_BINARY: bin/crsp
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          all=$(find e2e/tests -name '*.spec.ts' ! -name ux-routes.spec.ts | sort)
          files=$(echo "$all" | python3 scripts/ci/e2e_plan.py --shard "$SHARD/4" --what files)
          slices=$(echo "$all" | python3 scripts/ci/e2e_plan.py --shard "$SHARD/4" --what slices)
          if [ -z "$files" ] && [ -z "$slices" ]; then
            echo "::error::nothing to run for shard $SHARD: an empty list would run every spec"
            exit 1
          fi
          slices_one_line=$(printf '%s' "$slices" | paste -sd ' ' -)
          echo "shard $SHARD files:"
          echo "$files"
          echo "shard $SHARD ux-routes slices (of 16): ${slices_one_line}"
          rc=0
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/playwright-times-files.json pnpm exec playwright test $files || rc=$?
          fi
          for s in $slices; do
            PLAYWRIGHT_JSON_OUTPUT_NAME="test-results/playwright-times-routes-$s.json" pnpm exec playwright test --shard="$s/16" e2e/tests/web-console/ux-routes.spec.ts || rc=$?
          done
          exit "$rc"

      # Quarantined specs (e2e/quarantine.json) still run and report, but cannot
      # fail the build. CRSP209: an empty list (it is [] now) skips the step; it
      # booted the server and Playwright to find 0 specs.
      - name: Quarantine list
        id: quarantine
        run: |
          n=0
          if [ -f e2e/quarantine.json ]; then
            n=$(node -e "console.log(JSON.parse(require('fs').readFileSync('e2e/quarantine.json','utf8')).length)")
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "quarantined specs: $n"
      - name: Playwright (quarantined specs, non-blocking)
        if: ${{ steps.quarantine.outputs.count != '0' }}
        continue-on-error: true
        env:
          E2E_BINARY: bin/crsp
          E2E_QUARANTINE: only
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright-times-quarantine.json
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

      # Per-test times (Playwright JSON reporter); the e2e-times job merges them into
      # the artifact ci-run-times.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-e2e-times-${{ matrix.shard }}
          path: test-results/playwright-times-*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: test-results/artifacts
          if-no-files-found: ignore

  # CRSP209 (G7): one artifact with every e2e test's time, stable name ci-run-times
  # (artifact-prune keeps the newest). Not a required check, never fails the run.
  e2e-times:
    name: e2e test times
    needs: [e2e-shards]
    if: ${{ always() && needs.e2e-shards.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: ci-e2e-times-*
          merge-multiple: false
          path: ci-run-times
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-run-times
          path: ci-run-times
          if-no-files-found: ignore

  # The name a required check matches: green only when every shard is green. When
  # decide skips the run, or the build did not succeed, the shards are skipped and
  # this job is skipped-equivalent (passes), as the single e2e job was.
  e2e:
    name: e2e (Playwright)
    needs: [decide, carry, build, lint, types, e2e-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard succeeded
        env:
          SKIP: ${{ needs.decide.outputs.skip }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.e2e-shards.result }}
          RELEASE: ${{ needs.decide.outputs.release }}
          PLAN: ${{ needs.decide.outputs.e2e-shards }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
        run: |
          # CRSP349: a job the carry plan skipped passed on an earlier head.
          carried() { echo "$CARRIED" | jq -e --arg j "$1" 'has($j)' >/dev/null; }
          ok() { [ "$1" = "success" ] || { [ "$1" = "skipped" ] && carried "$2"; }; }
          if [ "$SHARDS" = "skipped" ] && carried e2e-shards; then
            echo "e2e shards carried from an earlier head"
          elif [ "$SKIP" = "true" ] || [ "$BUILD" != "success" ] || [ "$PLAN" = "false" ]; then
            echo "e2e did not run (decide skip=$SKIP, build=$BUILD, area plan=$PLAN); shards=$SHARDS"
            [ "$SHARDS" = "skipped" ]
          elif [ "$RELEASE" != "true" ] && ! { ok "$LINT" lint && ok "$TYPES" types; }; then
            # Not a release run: e2e waits for lint and types, and verify is red anyway.
            echo "e2e waited for lint ($LINT) and types ($TYPES); shards=$SHARDS"
            [ "$SHARDS" = "skipped" ]
          else
            echo "shards=$SHARDS"
            [ "$SHARDS" = "success" ]
          fi

  # CRSP349 (DS287, R5.91): the carry-forward summary. Green when every job of this run passed or was carried from
  # an earlier head (a table of job, result and the run that proved it is in the step summary). A job the area
  # plan skipped on purpose is left out. tests, verify and e2e are the required checks and count a carried skip too.
  carry-ok:
    name: carry-ok
    needs: [decide, carry, lint, types, go-race, web-tests, test-os, build, image, e2e-shards]
    if: ${{ always() && needs.decide.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/delivery
      - name: Every needed job passed or was carried
        env:
          NEEDS: ${{ toJSON(needs) }}
          CARRIED: ${{ needs.carry.outputs.carried || '{}' }}
          GO_PLAN: ${{ needs.decide.outputs.go-race }}
          WEB_PLAN: ${{ needs.decide.outputs.web-tests }}
          OS_PLAN: ${{ needs.decide.outputs.test-os }}
          BUILD_PLAN: ${{ needs.decide.outputs.build }}
          IMAGE_PLAN: ${{ needs.decide.outputs.image }}
          E2E_PLAN: ${{ needs.decide.outputs.e2e-shards }}
        run: |
          ignore="decide,carry"
          if [ "$GO_PLAN" = "false" ]; then ignore="$ignore,go-race"; fi
          if [ "$WEB_PLAN" = "false" ]; then ignore="$ignore,web-tests"; fi
          if [ "$OS_PLAN" = "false" ]; then ignore="$ignore,test-os"; fi
          if [ "$BUILD_PLAN" = "false" ]; then ignore="$ignore,build"; fi
          if [ "$IMAGE_PLAN" = "false" ]; then ignore="$ignore,image"; fi
          if [ "$E2E_PLAN" = "false" ]; then ignore="$ignore,e2e-shards"; fi
          python3 scripts/delivery/carry_verify.py --needs "$NEEDS" --carried "$CARRIED" --ignore "$ignore"
