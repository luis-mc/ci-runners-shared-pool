name: website-deploy

# Rebuilds the public website on Vercel when a stable release is published and once a night (docs/features/website
# R5.14), so the download page is never behind the release and edited notes and docs show up. It calls a Vercel
# deploy hook: the hook URL is the repository secret VERCEL_DEPLOY_HOOK_URL (the owner creates it in the Vercel
# project, Settings, Git, Deploy Hooks, branch main). Without the secret the run says so and stops without error.
#
# A release made by the Release workflow is published with the workflow's own token, and GitHub does not start
# workflows from events that token creates. So the `release` trigger covers a release published by hand and the
# `workflow_run` trigger covers the Release workflow finishing.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Say what would be called and do not call the hook'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  hook:
    name: hook
    # A pre-release (edge) and a failed Release run never rebuild the site (R5.13).
    if: >-
      github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ${{ fromJSON(vars.CRSP_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch || 'none' }}
    steps:
      - name: Call the Vercel deploy hook
        run: |
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "The Release run did not succeed ($RUN_CONCLUSION); the site is not rebuilt."
            exit 0
          fi
          case "$RUN_BRANCH" in
            none|v[0-9]*) ;;
            *) echo "The Release run was for $RUN_BRANCH, not a stable tag; the site is not rebuilt."; exit 0 ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would call the Vercel deploy hook (${HOOK:+secret set}${HOOK:-secret VERCEL_DEPLOY_HOOK_URL not set})."
            exit 0
          fi
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set; the site is not rebuilt. See docs/features/website section 9 (Q7)."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Vercel deploy hook called."
