name: Artifact prune

# Implements STACKSPEC 13.1 "Build artifacts": the platform keeps only the
# newest build artifact of each name. Artifacts are billed for storage, so one
# sweep a day deletes the older ones (DL379). It does not run after every
# workflow: a run per workflow took the one self-hosted slot many times a day.
# A project whose storage fills sooner starts it by hand (workflow_dispatch).
#
# The sweep reads the artifacts of the whole repository, so every workflow that
# uploads one is covered. Workflows that upload artifacts here, as a note:
# workflows: ["CI", "Release", "Package", "Package Windows", "Installer", "Installer packages", "Tray smoke"]
#
# Artifact names are stable per kind (crsp-linux-amd64, never one with a version
# or run number), or the grouping would not work.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Two prunes never overlap; a second one waits instead of cancelling the first,
# so a deletion is never cut off half way.
concurrency:
  group: artifact-prune
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: prune build artifacts
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      DELIVERY_SHARD: prune
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete all but the newest artifact of each name
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/artifact-prune.sh
